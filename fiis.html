<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Raio-X do FII — Muita Ação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Mesma identidade da marca, invertida: o marinho deixa de ser fundo e
       passa a ser tinta. O fundo e um off-white levemente quente, derivado
       do creme da marca, pra que o cartao branco puro se destaque dele sem
       precisar de borda forte nem sombra. */
    --ground:#FAF8F4; --card:#FFFFFF;
    --ink:#10233B; --ink-2:#4F6179; --ink-3:#8795A6;
    --gold:#C9A227; --gold-ink:#8A6D12;     /* o dourado nao tem contraste pra texto pequeno no branco */
    --line:#E8E3D9; --line-forte:#D8D2C4;
    --verde:#1C7F4D; --vermelho:#B5392B;    /* escurecidos pra ler no claro */
    --font:"Poppins",Arial,Helvetica,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ground);color:var(--ink);
       font-family:var(--font);padding:0 16px 70px;font-size:14px;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto}
  a{color:var(--gold-ink)}

  header.topo{display:flex;align-items:center;gap:11px;flex-wrap:wrap;
    position:sticky;top:0;z-index:5;padding:14px 0;margin-bottom:22px;
    background:var(--ground);border-bottom:1px solid var(--line)}
  .marca{font-weight:800;color:var(--ink);font-size:.95rem;letter-spacing:.01em}
  .busca{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .voltar{font-size:.82rem;font-weight:700;color:var(--ink-2);text-decoration:none}
  .voltar:hover{color:var(--gold-ink)}
  .voltar[hidden],#conteudo[hidden],#vista-lista[hidden]{display:none}
  #vista-lista th:nth-child(3),#vista-lista td:nth-child(3),
  #vista-lista th:nth-child(4),#vista-lista td:nth-child(4){text-align:left}
  #vista-lista td:nth-child(4){max-width:170px;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
  .lista-conta{font-size:.78rem;color:var(--ink-3);margin:10px 2px 0}
  input[type=search]{min-width:230px;padding:10px 14px;border-radius:9px;font-family:var(--font);
    font-size:.95rem;background:var(--card);border:1px solid var(--line-forte);color:var(--ink)}
  input[type=search]::placeholder{color:var(--ink-3)}
  input[type=search]:focus{outline:2px solid var(--gold);outline-offset:1px}

  /* ---------- cabecalho da empresa ---------- */
  /* Sem cartao: o nome da empresa e a cotacao sao o topo da pagina, nao um
     bloco dentro dela. So uma regra fina embaixo. */
  .ficha{padding:4px 2px 16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
  .ficha .linha1{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .papel{font-size:2rem;font-weight:800;color:var(--ink);letter-spacing:-.01em;line-height:1.1}
  .empresa{font-size:1rem;color:var(--ink-2)}
  .setor{font-size:.8rem;color:var(--ink-3)}
  .cotacao{margin-left:auto;text-align:right}
  .cotacao .v{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .cotacao .d{font-size:.78rem;color:var(--ink-3);display:block}
  .avisos{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .tag{font-size:.7rem;padding:4px 10px;border-radius:20px;border:1px solid var(--line-forte);
    background:var(--card);color:var(--ink-2)}
  .tag.alerta{border-color:rgba(181,57,43,.35);background:#FDF4F2;color:var(--vermelho)}

  /* ---------- grafico ---------- */
  .grafico{border:1px solid var(--line);border-radius:14px;padding:16px 18px 10px;
    background:var(--card);margin-bottom:22px}
  .periodos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .periodos button{background:var(--card);border:1px solid var(--line-forte);color:var(--ink-2);
    padding:6px 13px;border-radius:8px;cursor:pointer;font-family:var(--font);font-size:.78rem;
    font-weight:600;transition:.15s}
  .periodos button:hover{border-color:var(--gold);color:var(--ink)}
  .periodos button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  canvas{width:100%;height:260px;display:block;touch-action:pan-y}
  .resumo-grafico{display:flex;gap:20px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-3);
    padding:10px 2px 2px}
  .resumo-grafico b{color:var(--ink);font-variant-numeric:tabular-nums}

  /* ---------- precos de valuation ---------- */
  .valuation{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;
    margin-bottom:18px}
  .metodo{border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:var(--card)}
  /* o unico lugar onde o dourado e preenchimento: o numero que resume os outros */
  .metodo.media{border-color:var(--gold);background:#FFFCF2}
  /* com sete metodos a Media sobrava sozinha numa segunda linha: vira uma
     faixa de largura inteira, embaixo, que e o papel dela (o resumo) */
  .valuation .metodo.media{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
  .valuation .metodo.media .nome{flex-basis:100%}
  .metodo .nome{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--gold-ink);
    font-weight:700}
  .metodo .preco{font-size:1.35rem;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
  .metodo .margem{font-size:.8rem;font-weight:700;margin-top:3px}
  .metodo .nota{font-size:.68rem;color:var(--ink-3);margin-top:7px;line-height:1.45}
  .pos{color:var(--verde)} .neg{color:var(--vermelho)} .na{color:var(--ink-3)}

  /* ---------- paineis de indicadores ---------- */
  /* 300px: o rotulo mais longo ("Margem EBIT recorrente" + icone, ~200px) cabe numa linha
     ao lado do valor mais largo do painel; min() para nao estourar celular estreito */
  .paineis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px}
  .painel{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:15px 14px}
  .painel h3{margin:0 0 12px;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;
    color:var(--gold-ink);font-weight:700}
  .painel dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:baseline}
  .painel dt,.painel dd{padding:6px 0;border-top:1px solid var(--line)}
  .painel dt:first-of-type,.painel dd:first-of-type{border-top:0;padding-top:0}
  /* flex: o icone do historico fica sempre ao lado do rotulo, nunca sozinho na 2a linha */
  .painel dt{color:var(--ink-2);font-size:.8rem;display:flex;align-items:center}
  .painel dt .hist{flex:none}
  .painel dd .sob{display:block;font-size:.66rem;font-weight:500;line-height:1.2;margin-top:1px}
  .painel dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:.88rem}

  /* ---------- lista ---------- */
  .lista{border:1px solid var(--line);border-radius:12px;background:var(--card);
    overflow-x:auto;margin-top:12px}
  table{width:100%;border-collapse:collapse;font-size:.84rem;min-width:620px}
  th{text-align:right;padding:11px 10px;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink-2);background:var(--card);border-bottom:1px solid var(--line-forte);
    cursor:pointer;white-space:nowrap;user-select:none;position:sticky;top:0}
  th:hover{color:var(--gold-ink)}
  th:first-child,th:nth-child(2){text-align:left}
  td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums;white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  td:first-child{text-align:left;font-weight:700;color:var(--ink);cursor:pointer}
  td:nth-child(2){text-align:left;color:var(--ink-2);max-width:210px;overflow:hidden;text-overflow:ellipsis}
  tbody tr:hover{background:#FFFBEF;cursor:pointer}

  .rodape{margin-top:26px;padding:16px 18px;border-radius:11px;background:var(--card);
    border:1px solid var(--line);font-size:.76rem;line-height:1.7;color:var(--ink-2)}
  .rodape b{color:var(--ink)}
  h2.sec{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);
    margin:28px 0 11px;font-weight:700}
  .carregando{padding:50px;text-align:center;color:var(--ink-3)}

  /* ---------- abas ---------- */
  /* no celular as abas nao cabem: rolam dentro da faixa, sem empurrar a pagina para o lado */
  .abas{display:flex;gap:4px;margin:28px 0 14px;box-shadow:inset 0 -1px 0 var(--line);
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .abas::-webkit-scrollbar{display:none}
  .abas button{white-space:nowrap;flex:none}
  .abas button{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);
    padding:9px 15px;cursor:pointer;font-family:var(--font);font-size:.82rem;font-weight:700;
    letter-spacing:.02em;transition:.15s}
  .abas button:hover{color:var(--ink)}
  .abas button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--gold)}
  .aba-sub{color:var(--ink-2);font-size:.82rem;margin:0 0 12px}

  /* ---------- graficos anuais ---------- */
  .graficos{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
  .topo-bloco{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .mini-periodo{display:flex;gap:2px;background:#F3EFE6;border-radius:8px;padding:2px}
  .mini-periodo button{font-family:var(--font);font-size:.7rem;padding:3px 8px;border:0;border-radius:6px;
    background:none;color:var(--ink-2);cursor:pointer}
  .mini-periodo button.ativo{background:var(--card);color:var(--ink);font-weight:600;
    box-shadow:0 1px 2px rgba(16,35,59,.12)}
  .nota-periodo{font-size:.76rem;color:var(--ink-3);margin-left:6px}
  .bloco{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:15px 17px 10px}
  .bloco h3{margin:0 0 2px;font-size:.84rem;font-weight:700;color:var(--ink)}
  .bloco .sub{font-size:.7rem;color:var(--ink-3);margin-bottom:8px}
  .bloco canvas{height:190px}
  .legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.7rem;color:var(--ink-2);padding:4px 0 2px}
  .legenda i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;
    vertical-align:baseline}
  .vazio{padding:28px 6px;text-align:center;color:var(--ink-3);font-size:.8rem}

  /* ---------- historico do indicador ---------- */
  .hist{border:1px solid var(--line-forte);background:var(--card);border-radius:6px;
    padding:1px 4px 0;margin-left:5px;cursor:pointer;line-height:0;vertical-align:middle;
    color:var(--ink-3);transition:.15s}
  .hist:hover{border-color:var(--gold);color:var(--gold-ink)}
  .hist svg{display:block}
  .modal{position:fixed;inset:0;z-index:20;background:rgba(16,35,59,.42);
    display:flex;align-items:center;justify-content:center;padding:16px}
  /* o display:flex acima ganha do [hidden] do navegador por especificidade:
     sem esta linha o modal nasce aberto */
  .modal[hidden]{display:none}
  .modal .caixa{background:var(--card);border-radius:14px;max-width:720px;width:100%;
    max-height:92vh;overflow-y:auto;border:1px solid var(--line-forte)}
  .modal header{display:flex;align-items:center;gap:12px;padding:18px 22px 14px}
  .modal h3{margin:0;font-size:1.25rem;font-weight:800;color:var(--ink)}
  .modal .fechar{margin-left:auto;border:0;background:var(--ground);color:var(--ink-2);
    width:34px;height:34px;border-radius:50%;font-size:1.2rem;cursor:pointer;line-height:1}
  .modal .fechar:hover{background:var(--ink);color:#fff}
  .sumario{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:1px;background:var(--line);border-top:1px solid var(--line);
    border-bottom:1px solid var(--line)}
  .sumario div{background:var(--card);padding:13px 22px}
  .sumario dt{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);
    font-weight:700}
  .sumario dd{margin:3px 0 0;font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
  .sumario .obs{font-size:.72rem;font-weight:600;color:var(--ink-2);padding:0;background:none}
  /* .pos/.neg sozinhas perdem pra .sumario .obs na especificidade */
  .sumario .obs.pos{color:var(--verde)} .sumario .obs.neg{color:var(--vermelho)}
  #modal-chart{height:300px;padding:6px 10px 0}
  .modal .nota{padding:4px 22px 18px;font-size:.72rem;color:var(--ink-3);line-height:1.6}

  /* ---------- so do FII ---------- */
  .filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .filtros button{background:var(--card);border:1px solid var(--line-forte);color:var(--ink-2);
    padding:5px 12px;border-radius:20px;cursor:pointer;font-family:var(--font);font-size:.75rem;font-weight:600}
  .filtros button:hover{border-color:var(--gold);color:var(--ink)}
  .filtros button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .filtros{flex-direction:column;align-items:stretch}
  .filtros-linha{display:flex;gap:6px;flex-wrap:wrap}
  .filtros-linha.sub button{font-size:.7rem;padding:4px 10px;font-weight:500}
  .filtros select{font-family:var(--font);font-size:.75rem;padding:5px 10px;border-radius:20px;
    border:1px solid var(--line-forte);background:var(--card);color:var(--ink-2);margin-left:auto}
  .bloco.largo{grid-column:1/-1}
  .bloco.largo canvas{height:240px}
  .barras-css{display:grid;grid-template-columns:minmax(120px,auto) 1fr 56px;gap:9px 12px;
    align-items:center;font-size:.8rem;margin-top:6px}
  .barras-css .rot{color:var(--ink-2)}
  .barras-css .trilho{background:#F3EFE6;border-radius:4px;height:11px;overflow:hidden}
  .barras-css .trilho i{display:block;height:100%;background:var(--ink);border-radius:4px}
  .barras-css .trilho i.ouro{background:var(--gold)}
  .barras-css .val{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
  .tab-imoveis{width:100%;min-width:560px}
  .tab-imoveis td:first-child{white-space:normal;max-width:260px;cursor:default}
  .tab-imoveis td:nth-child(2){white-space:normal;max-width:200px}
  .tab-imoveis tbody tr:hover{background:none;cursor:default}
  .tab-rend{min-width:0}
  .tab-rend td:first-child{cursor:default;font-weight:600}
  .tab-rend tbody tr:hover{background:none;cursor:default}
  .agrupa{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;color:var(--ink-2);
    cursor:pointer;margin-left:auto;user-select:none}
  .agrupa input{accent-color:var(--ink);margin:0;cursor:pointer}
  .agrupa.off{opacity:.4;cursor:default}
  .resumo-linha{display:flex;gap:22px;flex-wrap:wrap;font-size:.8rem;color:var(--ink-2);margin:0 0 12px}
  .resumo-linha b{color:var(--ink);font-variant-numeric:tabular-nums}
  /* rotulo da barra ao passar o mouse ou tocar (como no Status) */
  .dica{position:fixed;z-index:40;pointer-events:none;background:rgba(16,35,59,.94);color:#fff;
    font-size:.72rem;padding:6px 10px;border-radius:7px;white-space:nowrap;display:none;
    box-shadow:0 2px 8px rgba(16,35,59,.25)}
  .dica b{display:block;font-size:.9rem;font-weight:700;font-variant-numeric:tabular-nums}
  td a.lk{color:inherit;text-decoration:none}
  td a.lk:hover{text-decoration:underline}
</style>
</head>
<body>
<script src="menu.js"></script>
<script src="aovivo.js"></script>
<script src="filtros.js"></script>
<script src="documentos.js"></script>
<div class="wrap">

  <header class="topo">
    <a class="voltar" id="voltar" href="fiis.html" hidden>&larr; Todos os FIIs</a>
    <div class="busca">
      <input type="search" id="busca" placeholder="Ticker, fundo ou segmento…" list="tickers" autocomplete="off" spellcheck="false">
      <datalist id="tickers"></datalist>
    </div>
  </header>

  <div id="conteudo"><div class="carregando">Carregando a base…</div></div>

  <section id="vista-lista" hidden>
  <h2 class="sec" id="tit-lista">Fundos imobiliários</h2>
  <div class="filtros" id="filtros"></div>
  <div id="filtros-num"></div>
  <p class="lista-conta" id="lista-conta"></p>
  <div class="lista">
    <table>
      <thead><tr id="cabeca"></tr></thead>
      <tbody id="corpo"><tr><td colspan="12" class="carregando">…</td></tr></tbody>
    </table>
  </div>
  </section>

  <div class="rodape" id="rodape"></div>
</div>

<div class="modal" id="modal" hidden>
  <div class="caixa" role="dialog" aria-modal="true" aria-labelledby="modal-tit">
    <header><h3 id="modal-tit"></h3>
      <button class="fechar" id="modal-fechar" aria-label="Fechar">&times;</button></header>
    <div class="sumario" id="modal-sumario"></div>
    <canvas id="modal-chart"></canvas>
    <p class="nota" id="modal-nota"></p>
  </div>
</div>

<script>
(function () {
  "use strict";
  var BASE = null, HIST = {}, PROV = {}, LISTA = [], ATUAL = null, PERIODO = 365;
  var FILTRO = "Todos", SEGMENTO = "", ABA = "ren", MODO_REN = "mes";
  // "Agrupar por ano", como no Status: o periodo escolhe a janela, e isto
  // troca cada rendimento pelo total do ano. Nao vale no "Mes a mes", que ja
  // e a comparacao com o ano anterior.
  var AGRUPA = false;
  var ordem = { col: "volume", asc: false };
  var COR_LINHA = "#10233B";
  var COR = { azul: "#10233B", ouro: "#C9A227", verde: "#1C7F4D", vermelho: "#B5392B", cinza: "#B9C1CC" };
  var MESES = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
  var TIPOS = ["Todos", "Tijolo", "Papel", "Fundo de fundos", "Híbrido", "Desenvolvimento"];
  var $ = function (id) { return document.getElementById(id); };

  // ---------- formatacao ----------
  function brl(v, casas) {
    if (v === null || v === undefined || !isFinite(v)) return null;
    return v.toLocaleString("pt-BR", { minimumFractionDigits: casas === undefined ? 2 : casas,
                                       maximumFractionDigits: casas === undefined ? 2 : casas });
  }
  function num(v, casas, sufixo) {
    var s = brl(v, casas);
    return s === null ? '<span class="na">—</span>' : s + (sufixo || "");
  }
  function esc(s) {
    return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }
  function dataBR(iso) {
    if (!iso) return "—";
    var p = String(iso).slice(0, 10).split("-");
    return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : iso;
  }
  function grande(v) {         // R$ em mi / bi
    if (v === null || v === undefined || !isFinite(v)) return '<span class="na">—</span>';
    if (Math.abs(v) >= 1e9) return "R$ " + brl(v / 1e9, 2) + " bi";
    if (Math.abs(v) >= 1e6) return "R$ " + brl(v / 1e6, 1) + " mi";
    return "R$ " + brl(v / 1e3, 0) + " mil";
  }
  function inteiro(v) { return v === null || v === undefined ? '<span class="na">—</span>' : brl(v, 0); }

  // ---------- grafico de linha (o mesmo da ficha da acao) ----------
  function desenhar(canvas, serie, cor, opt) {
    opt = opt || {};
    var dpr = window.devicePixelRatio || 1;
    var L = canvas.clientWidth, A = canvas.clientHeight;
    canvas.width = L * dpr; canvas.height = A * dpr;
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, L, A);
    if (!serie || serie.length < 2) {
      ctx.fillStyle = "rgba(16,35,59,.42)"; ctx.font = "13px Poppins, Arial";
      ctx.fillText("Sem histórico para este período.", 12, A / 2);
      canvas._linha = null;
      return;
    }
    var mg = { e: 52, d: 10, t: 14, b: 22 };
    var vs = serie.map(function (p) { return p[1]; });
    var min = Math.min.apply(null, vs), max = Math.max.apply(null, vs);
    if (max === min) { max += 1; min -= 1; }
    var folga = (max - min) * 0.08; min -= folga; max += folga;
    if (opt.ref !== undefined && opt.ref !== null) { min = Math.min(min, opt.ref); max = Math.max(max, opt.ref); }

  // ---------- cotacao do dia (aovivo.js: direto da B3, com atraso) ----------
  // So do papel aberto, buscado pelo navegador de quem le. Sem ela (B3 fora,

  var VIVO = null;                   // {t, d}
  function vivoDe(t) { return VIVO && VIVO.t === t ? VIVO.d : null; }
  function seguirVivo(t) {

  // a serie do grafico: o dia minuto a minuto no "1d"; nos outros periodos,

    if (PERIODO === 1 && v) return { s: v.serie, opt: { data: window.AoVivo.rotulo(v) }, dia: v };

  // ---------- aba: rendimentos (como o grafico do Status Invest) ----------
  var NOME_REN = { mes: "Mês a mês", u24: "24 meses", a5: "5 anos", max: "Máx" };
  function visaoRend(t, modo) {
    var r = rendimentos(t);
    if (!r.length) return null;
    var hoje = BASE.fiis[t].data || new Date().toISOString().slice(0, 10);
    var ano = Number(hoje.slice(0, 4));
    if (modo === "mes") {
      // ano corrente contra o anterior, mes a mes, pela data-com
      var a = [], b = [];
      for (var m = 0; m < 12; m++) { a.push(null); b.push(null); }
      r.forEach(function (x) {
        var y = Number(x[0].slice(0, 4)), mm = Number(x[0].slice(5, 7)) - 1;
        if (y === ano) b[mm] = (b[mm] || 0) + x[1];
        if (y === ano - 1) a[mm] = (a[mm] || 0) + x[1];
      });
      return { rotulos: MESES, series: [
        { nome: String(ano - 1), cor: COR.cinza, valores: a },
        { nome: String(ano), cor: COR.verde, valores: b }] };
    }
    var lista = r;
    if (modo === "u24") {
      var corte = new Date(hoje); corte.setMonth(corte.getMonth() - 24);
      var c = corte.toISOString().slice(0, 10);
      lista = r.filter(function (x) { return x[0] > c; });
    } else if (modo === "a5") {
      // 5 anos CIVIS: o corrente e os 4 anteriores (agrupado, 5 barras)
      lista = r.filter(function (x) { return Number(x[0].slice(0, 4)) > ano - 5; });
    }
    if (!AGRUPA)
      return { rotulos: lista.map(function (x) { return x[0].slice(5, 7) + "/" + x[0].slice(2, 4); }),
               series: [{ nome: "Rendimento por cota (pela data-com)", cor: COR.verde,
                          valores: lista.map(function (x) { return x[1]; }) }] };
    var por = {};
    lista.forEach(function (x) { var y = x[0].slice(0, 4); por[y] = (por[y] || 0) + x[1]; });
    var anos = Object.keys(por).sort();
    return { rotulos: anos, series: [{ nome: "Rendimento por cota no ano", cor: COR.verde,
             valores: anos.map(function (y) { return por[y]; }) }],
             parcial: anos.indexOf(String(ano)) >= 0 ? String(ano) : null };
  }
  function abaRendimentos() {
    var t = ATUAL, f = BASE.fiis[t];
    var v = visaoRend(t, MODO_REN);
    var h = '<div class="graficos"><div class="bloco largo"><div class="topo-bloco"><h3>Rendimentos por cota</h3>' +
      '<div class="mini-periodo" id="modo-ren">' + Object.keys(NOME_REN).map(function (k) {
        return '<button data-m="' + k + '" class="' + (k === MODO_REN ? "ativo" : "") + '">' + NOME_REN[k] + '</button>';
      }).join("") + '</div></div>' +
      '<div class="sub">R$ por cota, pela data-com, sem amortização' +
      (v && v.parcial ? " · " + v.parcial + " até agora" : "") + '</div>';
    if (!v) h += '<div class="vazio">Sem rendimento registrado para este fundo.</div>';
    else h += '<canvas id="c-ren"></canvas><div class="legenda">' + v.series.map(function (s) {
      return '<span><i style="background:' + s.cor + '"></i>' + esc(s.nome) + '</span>';
    }).join("") + '<label class="agrupa"><input type="checkbox" id="agrupa"' +
      (AGRUPA && MODO_REN !== "mes" ? " checked" : "") + '> Agrupar por ano</label></div>';
    h += '</div></div>';
    // tabela dos ultimos 12, com o yield sobre a cotacao da data-com
    var r = (PROV[t] || []).filter(function (x) { return x[1] > 0; })
      .sort(function (a, b) { return a[0] < b[0] ? 1 : -1; }).slice(0, 12)
      .map(function (x) { return [x[0], x[1] / fatorDepois(t, x[0]), x[2]]; });
    if (r.length) {
      h += '<h2 class="sec">Últimos rendimentos</h2><div class="lista"><table class="tab-rend"><thead><tr>' +
        '<th>Data-com</th><th>Tipo</th><th>Valor por cota</th><th>Cotação na data-com</th><th>Yield do mês</th></tr></thead><tbody>' +
        r.map(function (x) {
          var p = precoEm(t, x[0]);
          return '<tr><td>' + dataBR(x[0]) + '</td><td>' + (ehAmort(x) ? "Amortização" : "Rendimento") +
            '</td><td>R$ ' + brl(x[1], 2) + '</td><td>' +
            (p ? "R$ " + brl(p) : num(null)) + '</td><td>' + (p ? brl(x[1] / p * 100, 2) + "%" : num(null)) + '</td></tr>';
        }).join("") + '</tbody></table></div>';
    }
    $("aba").innerHTML = h;
    if (v) barras($("c-ren"), v.rotulos, v.series, { casas: 4, moeda: true });
    var ag = $("agrupa");
    // no "Mes a mes" a caixa nao tinha efeito e ficava desligada -- o Ricardo
    // clicou e "nao agrupa". Agora marcar ali leva ao Max agrupado por ano.
    if (ag) ag.addEventListener("change", function () {
      AGRUPA = ag.checked;
      if (AGRUPA && MODO_REN === "mes") MODO_REN = "max";
      abaRendimentos();
    });
    var mr = $("modo-ren");
    if (mr) mr.addEventListener("click", function (ev) {
      var b = ev.target.closest("button"); if (!b) return;
      MODO_REN = b.dataset.m; abaRendimentos();
    });

  // ---------- historico do P/VP e do VP por cota (o botao ao lado do nome) ----------
  // Igual a ficha da acao (pedido do Ricardo: padronizar): um botaozinho de
  // grafico depois do nome do multiplo abre o historico num modal, com media,
  // ultimo, menor e maior. Aqui o ponto e MENSAL (informe da CVM), entao os
  // valores saem no rotulo flutuante, nao escritos em cada ponto.
  function botaoHist(chave) {
    return '<button class="hist" data-ind="' + esc(chave) + '" aria-label="Histórico de ' +
      esc(chave) + '"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
      '<polyline points="3,17 9,11 13,15 21,6"/></svg></button>';
  }
  function mesAno(iso) { return iso.slice(5, 7) + "/" + iso.slice(0, 4); }
  var PATRI = {};
  function seriesPatrimonio(t) {
    if (PATRI[t]) return PATRI[t];
    var f = BASE.fiis[t];
    var vp = (f.historico || []).filter(function (x) { return x[1] > 0; })
      .map(function (x) { var d = fimDoMes(x[0]); return [d, x[1] / fatorDepois(t, d)]; });
    var pvp = vp.map(function (x) { var p = precoEm(t, x[0]); return p ? [x[0], p / x[1]] : null; })
      .filter(Boolean);
    return (PATRI[t] = { vp: vp, pvp: pvp });
  }
  var HIST_ABERTO = null;
  function abrirHist(chave) {
    var s = seriesPatrimonio(ATUAL), pvp = chave === "P/VP";
    var pontos = pvp ? s.pvp : s.vp;
    if (!pontos || pontos.length < 2) return;
    HIST_ABERTO = chave;
    var vals = pontos.map(function (p) { return p[1]; });
    var media = vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
    var ord = vals.slice().sort(function (a, b) { return a - b; });
    var med = ord.length % 2 ? ord[(ord.length - 1) / 2] : (ord[ord.length / 2 - 1] + ord[ord.length / 2]) / 2;
    var atual = pontos[pontos.length - 1];
    var menor = pontos.reduce(function (a, b) { return b[1] < a[1] ? b : a; });
    var maior = pontos.reduce(function (a, b) { return b[1] > a[1] ? b : a; });
    var v = function (x) { return (pvp ? "" : "R$ ") + brl(x, 2); };
    var dif = media ? brl(Math.abs(atual[1] / media - 1) * 100, 2) + "%" : "—";
    $("modal-tit").textContent = ATUAL + " · " + chave + " — histórico";
    $("modal-sumario").innerHTML =
      "<div><dt>Média</dt><dd>" + v(media) + "</dd>" +
        '<div class="obs">mediana ' + v(med) + "</div></div>" +
      "<div><dt>" + mesAno(atual[0]) + "</dt><dd>" + v(atual[1]) + "</dd>" +
        '<div class="obs ' + (atual[1] >= media ? "pos" : "neg") + '">' +
        dif + " " + (atual[1] >= media ? "acima" : "abaixo") + " da média</div></div>" +
      "<div><dt>Menor</dt><dd>" + v(menor[1]) + "</dd>" +
        '<div class="obs">' + mesAno(menor[0]) + "</div></div>" +
      "<div><dt>Maior</dt><dd>" + v(maior[1]) + "</dd>" +
        '<div class="obs">' + mesAno(maior[0]) + "</div></div>";
    $("modal-nota").textContent = pvp
      ? "Cotação do último pregão de cada mês dividida pelo valor patrimonial por cota do informe mensal da " +
        "CVM do mesmo mês, desde " + pontos[0][0].slice(0, 4) + ". Os dois estão na cota de hoje " +
        "(desdobramentos e grupamentos aplicados). Passe o mouse ou o dedo no gráfico para ver cada mês."
      : "Valor patrimonial por cota do informe mensal da CVM, na cota de hoje (desdobramentos e grupamentos " +
        "aplicados). Muda com a reavaliação dos imóveis e cai quando o fundo amortiza. Passe o mouse ou o " +
        "dedo no gráfico para ver cada mês.";
    $("modal").hidden = false;
    desenharHist();
    $("modal-fechar").focus();
  }
  function desenharHist() {
    var s = seriesPatrimonio(ATUAL), pvp = HIST_ABERTO === "P/VP";
    var pontos = pvp ? s.pvp : s.vp;
    var media = pontos.reduce(function (a, b) { return a + b[1]; }, 0) / pontos.length;
    desenhar($("modal-chart"), pontos, pvp ? COR.ouro : COR_LINHA,
             { moeda: !pvp, casas: 2, ref: media, refNome: "média", data: mesAno });
  }
  function fecharHist() { $("modal").hidden = true; HIST_ABERTO = null; tirarMira(); esconderDica(); }

  // ---------- lista: a pagina principal, com filtros (filtros.js) ----------
  // Como na acoes.html (pedido do Ricardo, 25/11/2026): sem ?t= abre na
  // lista. Tipo e segmento seguem nos botoes de cima; os numeros no filtros.js.
  // Tudo vai no endereco (?tipo=Tijolo&p_vp_max=0.9&dy_12m_min=10).
  var FILTROS = null;
  var COLUNAS = [
    ["ticker", "Ticker"], ["nome", "Fundo"], ["tipo", "Tipo"], ["segmento", "Segmento"], ["preco", "Preço"],
    ["p_vp", "P/VP"], ["dy_12m", "DY 12m"], ["ult", "Últ. rend."], ["vacancia", "Vacância"],
    ["valor_mercado", "Valor de mercado"], ["volume", "Volume"], ["cotistas", "Cotistas"]
  ];
  function criarFiltros() {
    var q = new URLSearchParams(location.search);
    if (q.get("tipo") && TIPOS.indexOf(q.get("tipo")) >= 0) FILTRO = q.get("tipo");
    if (q.get("segmento")) SEGMENTO = q.get("segmento");
    FILTROS = Filtros({
      el: $("filtros-num"),
      grupos: [
        { nome: "Valuation", campos: [
          { k: "p_vp", nome: "P/VP", unid: "×" }, { k: "dy_12m", nome: "DY 12 meses", unid: "%" },
          { k: "yield_ult", nome: "Yield do último rend.", unid: "%" }] },
        { nome: "Tamanho e liquidez", campos: [
          { k: "valor_mercado", nome: "Valor de mercado", unid: "mi", mult: 1e6 },
          { k: "pl", nome: "Patrimônio líquido", unid: "mi", mult: 1e6 },
          { k: "volume", nome: "Volume no pregão", unid: "mi", mult: 1e6 },
          { k: "cotistas", nome: "Cotistas", unid: "mil", mult: 1e3 }] },
        { nome: "Imóveis e custo", nota: "Vacância só de quem declara imóveis à CVM e com o dado confiável.",
          campos: [
          { k: "vacancia", nome: "Vacância física", unid: "%" }, { k: "n_imoveis", nome: "Nº de imóveis", unid: "" },
          { k: "pct_imoveis", nome: "Em imóveis (do ativo)", unid: "%" },
          { k: "taxa_adm", nome: "Taxa de adm. ao mês", unid: "%" }] }
      ],
      aoMudar: function () {
        render();
        try { history.replaceState({}, "", urlLista()); } catch (e) { /* file:// */ }
      }
    });
  }
  function urlLista() {
    var q = new URLSearchParams(FILTROS ? FILTROS.consulta() : "");
    if (FILTRO !== "Todos") q.set("tipo", FILTRO);
    if (SEGMENTO) q.set("segmento", SEGMENTO);
    var s = q.toString();
    return location.pathname + (s ? "?" + s : "");
  }
  function mostrarLista(empurrar) {
    ATUAL = null;
    if (window.AoVivo && window.AoVivo.parar) window.AoVivo.parar();
    $("conteudo").hidden = true; $("vista-lista").hidden = false; $("voltar").hidden = true;
    document.title = "FIIs — Muita Ação";
    if (empurrar) { try { history.pushState({}, "", urlLista()); } catch (e) { /* file:// */ } }
    render();
  }
  function cabecalho() {
    $("cabeca").innerHTML = COLUNAS.map(function (c) {
      return '<th data-col="' + c[0] + '"' + (ordem.col === c[0] ? ' aria-sort="' + (ordem.asc ? "ascending" : "descending") + '"' : "") +
        ">" + c[1] + (ordem.col === c[0] ? (ordem.asc ? " ↑" : " ↓") : "") + "</th>";
    }).join("");
  }
  function render() {
    if (!FILTROS) return;
    var q = $("busca").value.trim().toUpperCase();
    var linhas = LISTA.filter(function (x) {
      if (FILTRO !== "Todos" && x.tipo !== FILTRO) return false;
      if (SEGMENTO && (x.segmento || "Sem segmento") !== SEGMENTO) return false;
      if (!FILTROS.passa(x.ord)) return false;
      if (!q) return true;
      return (x.ticker + " " + x.nome + " " + (x.segmento || "") + " " + (x.tipo || "")).toUpperCase().indexOf(q) >= 0;
    });
    var c = ordem.col, s = ordem.asc ? 1 : -1;
    linhas.sort(function (a, b) {
      var va = a.ord[c], vb = b.ord[c];
      if (va === null || va === undefined) return 1;
      if (vb === null || vb === undefined) return -1;
      return (typeof va === "string" ? va.localeCompare(vb) : va - vb) * s;
    });
    cabecalho();
    $("lista-conta").textContent = linhas.length === LISTA.length
      ? LISTA.length + " FIIs · clique no título de uma coluna para ordenar"
      : linhas.length + " de " + LISTA.length + " FIIs passam no filtro";
    $("corpo").innerHTML = linhas.map(function (x) {
      return '<tr data-t="' + x.ticker + '"><td><a class="lk" href="?t=' + encodeURIComponent(x.ticker) + '">' +
        x.ticker + '</a></td><td>' + esc(x.nome) + '</td>' +
        '<td>' + esc(x.tipo || "—") + '</td><td>' + esc(x.segmento || "—") + '</td>' +
        '<td>' + num(x.preco) + '</td><td>' + num(x.p_vp) + '</td><td>' + num(x.dy_12m, 2, "%") + '</td>' +
        '<td>' + num(x.ord.ult) + '</td><td>' + num(x.ord.vacancia, 1, "%") + '</td>' +
        '<td>' + grande(x.valor_mercado) + '</td><td>' + grande(x.volume) + '</td>' +
        '<td>' + inteiro(x.cotistas) + '</td></tr>';
    }).join("") || '<tr><td colspan="12" class="carregando">Nenhum FII passa nesses filtros.</td></tr>';
  }
  // Tipo na primeira linha; na segunda, os SEGMENTOS do tipo escolhido, com a
  // contagem (pedido do Ricardo: dentro de tijolo, ver shoppings, lajes,
  // galpoes...). Trocar de tipo zera o segmento.
  function montarFiltros() {
    var dele = LISTA.filter(function (x) { return FILTRO === "Todos" || x.tipo === FILTRO; });
    var segs = {};
    dele.forEach(function (x) { var k = x.segmento || "Sem segmento"; segs[k] = (segs[k] || 0) + 1; });
    var ordemSeg = Object.keys(segs).sort(function (a, b) { return segs[b] - segs[a] || a.localeCompare(b); });
    $("filtros").innerHTML = '<div class="filtros-linha">' + TIPOS.map(function (t) {
      var n = t === "Todos" ? LISTA.length : LISTA.filter(function (x) { return x.tipo === t; }).length;
      return '<button data-t="' + t + '" aria-pressed="' + (t === FILTRO) + '">' + t + ' · ' + n + '</button>';
    }).join("") + '</div><div class="filtros-linha sub">' +
      '<button data-s="" aria-pressed="' + (!SEGMENTO) + '">Todos os segmentos</button>' +
      ordemSeg.map(function (k) {
        return '<button data-s="' + esc(k) + '" aria-pressed="' + (k === SEGMENTO) + '">' + esc(k) + ' · ' + segs[k] + '</button>';
      }).join("") + '</div>';
  }
  function ligarFiltros() {
    $("filtros").addEventListener("click", function (ev) {
      var b = ev.target.closest("button"); if (!b) return;
      if (b.dataset.t !== undefined) { FILTRO = b.dataset.t; SEGMENTO = ""; }
      else SEGMENTO = b.dataset.s;
      montarFiltros();
      render();
      try { history.replaceState({}, "", urlLista()); } catch (e) { /* file:// */ }
    });
  }

  Promise.all([
    fetch("fiis.json").then(function (r) { return r.json(); }),
    fetch("historico.json").then(function (r) { return r.json(); }).catch(function () { return {}; }),
    fetch("proventos.json").then(function (r) { return r.json(); }).catch(function () { return {}; })
  ]).then(function (res) {
    BASE = res[0]; HIST = res[1]; PROV = res[2];
    Object.keys(BASE.fiis).forEach(function (t) {
      var f = BASE.fiis[t];
      var x = Object.assign({ ticker: t }, f);
      x.ord = { ticker: t, nome: f.nome, tipo: f.tipo, segmento: f.segmento, preco: f.preco, p_vp: f.p_vp,
                dy_12m: f.dy_12m, ult: f.ultimo_rendimento ? f.ultimo_rendimento[1] : null,
                valor_mercado: f.valor_mercado, volume: f.volume, cotistas: f.cotistas, pl: f.pl,
                yield_ult: f.ultimo_rendimento && f.preco ? f.ultimo_rendimento[1] / f.preco * 100 : null,
                vacancia: f.vacancia_inconsistente || !(f.imoveis || []).length ? null : f.vacancia_fisica,
                n_imoveis: (f.imoveis || []).length, pct_imoveis: f.composicao ? f.composicao.imoveis : null,
                taxa_adm: f.taxa_adm_mes !== null && f.taxa_adm_mes !== undefined ? f.taxa_adm_mes * 100 : null };
      LISTA.push(x);
    });
    LISTA.sort(function (a, b) { return (b.volume || 0) - (a.volume || 0); });
    $("tickers").innerHTML = LISTA.map(function (x) {
      return '<option value="' + x.ticker + '">' + esc(x.nome) + "</option>";
    }).join("");
    var cf = BASE.conferencia || {};
    $("rodape").innerHTML =
      "<b>" + LISTA.length + " fundos imobiliários</b> com cotação na B3 e informe na CVM. " +
      "Patrimônio, cotas, cotistas, composição e segmento do <b>Informe Mensal</b> da CVM; imóveis, " +
      "vacância e inquilinos do <b>Informe Trimestral</b>; cotação do pregão da B3; rendimentos por cota " +
      "do histórico do Fundamentus. " +
      (cf.p_vp ? "Conferido contra o Fundamentus na mesma cotação: P/VP bate em <b>" + brl(cf.p_vp.acerto_pct, 1) +
        "%</b> dos fundos" + (cf.dy_12m ? ", DY de 12 meses em <b>" + brl(cf.dy_12m.acerto_pct, 1) + "%</b>" : "") +
        (cf.vacancia ? ", vacância em <b>" + brl(cf.vacancia.acerto_pct, 1) + "%</b>" : "") + ". " : "") +
      "<br><br><b>Tipo</b> é nosso, pela composição do informe mensal (a CVM só dá o segmento). " +
      "<b>Segmento</b> do tijolo: o do Investidor10 quando ele dá um segmento específico; senão o da CVM; " +
      "senão deduzido dos nomes dos imóveis quando 60% ou mais da receita está num segmento só. A CVM põe quase " +
      "todo tijolo em “Multicategoria”, e no que ela é específica bate com o Investidor10 em 91% dos fundos. " +
      "No fundo de papel e no de fundos, o segmento é o que eles carregam. " +
      "<b>Vacância física</b> é a média dos imóveis pela área, como declarada à CVM. " +
      "<b>DY</b> é a soma dos rendimentos com data-com nos últimos 12 meses sobre a cotação de hoje. " +
      "Volume é o do último pregão.<br><br>" +
      "Conteúdo educacional, não é recomendação de investimento.";
    criarFiltros();
    montarFiltros();
    ligarFiltros();
    var pedido = tickerDaUrl();
    if (BASE.fiis[pedido]) abrir(pedido);
    else { PRIMEIRA = false; mostrarLista(false); }
  }).catch(function () {
    $("conteudo").innerHTML = '<div class="carregando">Não consegui carregar a base de FIIs.</div>';
  });

  $("busca").addEventListener("input", function () {
    var t = $("busca").value.trim().toUpperCase();
    if (BASE && BASE.fiis[t]) { abrir(t); return; }
    if (t && $("vista-lista").hidden) mostrarLista(true);
    else render();
  });
  $("voltar").addEventListener("click", function (ev) {
    if (!cliqueSimples(ev)) return;
    ev.preventDefault();
    mostrarLista(true);
    window.scrollTo({ top: 0 });
  });
  $("corpo").addEventListener("click", function (ev) {
    var tr = ev.target.closest("tr");
    if (!tr || !tr.dataset.t || !cliqueSimples(ev)) return;
    ev.preventDefault();
    abrir(tr.dataset.t); window.scrollTo({ top: 0, behavior: "smooth" });
  });
  window.addEventListener("popstate", function () {
    if (!BASE) return;
    var t = tickerDaUrl();
    if (BASE.fiis[t]) { VOLTANDO = true; abrir(t); VOLTANDO = false; return; }
    var q = new URLSearchParams(location.search);
    FILTRO = TIPOS.indexOf(q.get("tipo")) >= 0 ? q.get("tipo") : "Todos";
    SEGMENTO = q.get("segmento") || "";
    montarFiltros();
    if (FILTROS) FILTROS.lerUrl();
    mostrarLista(false);
  });
  $("cabeca").addEventListener("click", function (ev) {
    var th = ev.target.closest("th[data-col]");
    if (!th) return;
    var c = th.dataset.col;
    var texto = c === "ticker" || c === "nome" || c === "tipo" || c === "segmento";
    ordem = (ordem.col === c) ? { col: c, asc: !ordem.asc } : { col: c, asc: texto };
    render();
  });
  window.addEventListener("resize", function () {
    if (!ATUAL) return;
    grafPreco();
    if (ABA === "ren") abaAtual();
    if (HIST_ABERTO) desenharHist();
  });
  $("modal-fechar").addEventListener("click", fecharHist);
  $("modal").addEventListener("click", function (ev) { if (ev.target === $("modal")) fecharHist(); });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && HIST_ABERTO) fecharHist();
  });
  // delegado: a ficha e reescrita a cada troca de fundo
  $("conteudo").addEventListener("click", function (ev) {
    var b = ev.target.closest(".hist");
    if (b && ATUAL) abrirHist(b.dataset.ind);
  });
})();
</script>
</body>
</html>
