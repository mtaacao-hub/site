<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>P/L da Bolsa — Muita Ação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Tokens copiados do acoes.html (tema claro da marca), como manda o
     CLAUDE.md para tela nova. */
  :root{
    --ground:#FAF8F4; --card:#FFFFFF;
    --ink:#10233B; --ink-2:#4F6179; --ink-3:#8795A6;
    --gold:#C9A227; --gold-ink:#8A6D12;
    --line:#E8E3D9; --line-forte:#D8D2C4;
    --verde:#1C7F4D; --vermelho:#B5392B;
    --font:"Poppins",Arial,Helvetica,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ground);color:var(--ink);
       font-family:var(--font);padding:0 16px 70px;font-size:14px;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto}
  header.topo{display:flex;align-items:center;gap:11px;padding:14px 0;margin-bottom:22px;
    border-bottom:1px solid var(--line)}
  .marca{font-weight:800;font-size:.95rem}
  h1{font-size:1.7rem;font-weight:800;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--ink-2);margin:0 0 22px;max-width:760px;line-height:1.55}
  .cartoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:22px}
  .cartao{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .cartao .rot{font-size:.72rem;color:var(--gold-ink);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .cartao .v{font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;margin-top:4px}
  .cartao .n{font-size:.75rem;color:var(--ink-3);margin-top:2px}
  .cartao .v.menor{font-size:1.25rem;padding-top:6px}
  .grafico{border:1px solid var(--line);border-radius:14px;padding:16px 18px 12px;background:var(--card);margin-bottom:22px}
  .controles{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .controles button{font-family:var(--font);font-size:.8rem;padding:6px 12px;border-radius:20px;
    border:1px solid var(--line-forte);background:var(--card);color:var(--ink-2);cursor:pointer}
  .controles button.ativo{background:var(--ink);border-color:var(--ink);color:#fff}
  .legenda{margin-left:auto;display:flex;gap:14px;font-size:.78rem;color:var(--ink-2)}
  .legenda i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
  canvas{width:100%;height:340px;display:block}
  .area{position:relative}
  .dica{position:absolute;top:6px;pointer-events:none;background:var(--card);border:1px solid var(--line-forte);
    border-radius:10px;padding:7px 10px;font-size:.76rem;line-height:1.5;box-shadow:0 2px 8px rgba(16,35,59,.08);
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .dica b{display:block;color:var(--ink);font-weight:600}
  .dica i{display:inline-block;width:9px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
  .titulo-tabela{font-size:.78rem;color:var(--gold-ink);font-weight:600;text-transform:uppercase;
    letter-spacing:.04em;margin:0 0 8px}
  th.grupo{text-align:center;border-bottom:1px solid var(--line);color:var(--ink-2)}
  td.sep,th.sep{border-left:1px solid var(--line)}
  tr.atual td{background:#FBF7EC;font-weight:600}
  .tabela{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:22px}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.82rem}
  th,td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--ink-3);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.03em}
  th:first-child,td:first-child{text-align:left}
  tr:last-child td{border-bottom:0}
  td.alto{color:var(--vermelho);font-weight:600}
  .notas{color:var(--ink-2);font-size:.8rem;line-height:1.6;max-width:820px}
  .notas b{color:var(--ink)}
  .erro{color:var(--vermelho)}
</style>
</head>
<body>
<div class="wrap">
  <header class="topo"><span class="marca">Muita Ação</span></header>
  <h1>P/L da bolsa</h1>
  <p class="sub">Preço sobre lucro do Ibovespa e de todas as empresas listadas, semana a semana desde 2010.
    O <b>mercado</b> inclui as empresas que depois saíram da bolsa. Sem elas, o histórico mostraria
    só as sobreviventes.</p>

  <div class="cartoes" id="cartoes"></div>

  <div class="grafico">
    <div class="controles">
      <button data-m="pl_lucrativas" class="ativo">Só lucrativas</button>
      <button data-m="pl">Com prejuízos</button>
      <button data-m="pl_mediana">Mediana</button>
      <span class="legenda">
        <span><i style="background:var(--ink)"></i>Ibovespa</span>
        <span><i style="background:var(--gold)"></i>Mercado</span>
      </span>
    </div>
    <div class="area">
      <canvas id="chart"></canvas>
      <div class="dica" id="dica" hidden></div>
    </div>
  </div>
  <p class="titulo-tabela" id="titulo-tabela"></p>

  <div class="tabela"><table id="tabela"></table></div>
  <div class="notas" id="notas"></div>
</div>
<script>
(function () {
  "use strict";
  var DADOS = null, MEDIDA = "pl_lucrativas";
  var TETO_EIXO = 40;   // 2015 passa de 90: sem teto, o resto vira uma linha reta
  function $(id) { return document.getElementById(id); }
  function num(v, c) {
    return (v === null || v === undefined) ? "—"
      : v.toLocaleString("pt-BR", { minimumFractionDigits: c === undefined ? 1 : c,
                                    maximumFractionDigits: c === undefined ? 1 : c });
  }
  function cor(nome) { return getComputedStyle(document.documentElement).getPropertyValue(nome).trim(); }

  // coluna de cada medida em DADOS.semanas[grupo] = [[data, pl, pl_lucrativas, pl_mediana, n]]
  var COL = { pl: 1, pl_lucrativas: 2, pl_mediana: 3 };
  var GEOM = null;   // o que o desenho usou, para a dica do mouse

  function tempo(iso) { return Date.parse(iso + "T12:00:00"); }

  // MEDIA HISTORICA: media de todas as semanas desde 2010, na medida do
  // botao. Semana sem valor (prejuizo somado zera o denominador) fica fora.
  function mediaHist(grupo) {
    var c = COL[MEDIDA], soma = 0, n = 0;
    (DADOS.semanas[grupo] || []).forEach(function (r) {
      if (r[c] !== null && r[c] !== undefined) { soma += r[c]; n++; }
    });
    return n ? soma / n : null;
  }

  function desenhar() {
    var canvas = $("chart"), dpr = window.devicePixelRatio || 1;
    var w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    var c = COL[MEDIDA];
    var series = [
      { nome: "Mercado", g: "mercado", cor: cor("--gold") },
      { nome: "Ibovespa", g: "ibov", cor: cor("--ink") }
    ].map(function (s) {
      s.p = (DADOS.semanas[s.g] || []).map(function (r) { return [tempo(r[0]), r[c], r[0]]; });
      return s;
    });
    var t0 = Infinity, t1 = -Infinity, maxv = 0;
    series.forEach(function (s) { s.p.forEach(function (p) {
      if (p[0] < t0) t0 = p[0]; if (p[0] > t1) t1 = p[0];
      if (p[1] !== null && p[1] > maxv) maxv = p[1];
    }); });
    var topo = Math.min(TETO_EIXO, Math.ceil(maxv / 5) * 5);
    var L = 34, R = 14, T = 14, B = 26, W = w - L - R, H = h - T - B;
    function X(t) { return L + (t - t0) / (t1 - t0) * W; }
    function Y(v) { return T + H - Math.min(v, topo) / topo * H; }   // eixo parte do zero
    ctx.font = "11px Poppins, Arial"; ctx.fillStyle = cor("--ink-3"); ctx.strokeStyle = cor("--line");
    ctx.lineWidth = 1;
    for (var g = 0; g <= topo; g += 10) {
      ctx.beginPath(); ctx.moveTo(L, Y(g)); ctx.lineTo(w - R, Y(g)); ctx.stroke();
      ctx.textAlign = "right"; ctx.fillText(g, L - 6, Y(g) + 4);
    }
    // um rotulo por ano, no 1o de janeiro; de dois em dois se apertar
    ctx.textAlign = "center";
    var a0 = new Date(t0).getFullYear(), a1 = new Date(t1).getFullYear();
    var passo = W / (a1 - a0 + 1) < 34 ? 2 : 1;
    for (var a = a0; a <= a1; a++) {
      var x = X(Date.parse(a + "-01-01T12:00:00"));
      if (x < L) continue;
      ctx.strokeStyle = cor("--line"); ctx.beginPath(); ctx.moveTo(x, T + H); ctx.lineTo(x, T + H + 4); ctx.stroke();
      if ((a - a0) % passo === 0) ctx.fillText("’" + String(a).slice(2), x + 14, h - 8);
    }
    series.forEach(function (s) {
      ctx.strokeStyle = s.cor; ctx.lineWidth = 1.8; ctx.lineJoin = "round";
      ctx.beginPath(); var aberto = false;
      s.p.forEach(function (p) {
        // prejuizo somado zera o denominador: sem ponto, a linha interrompe
        if (p[1] === null) { aberto = false; return; }
        if (!aberto) { ctx.moveTo(X(p[0]), Y(p[1])); aberto = true; } else ctx.lineTo(X(p[0]), Y(p[1]));
      });
      ctx.stroke();
    });
    // media historica: tracejada, na cor da serie, com o valor na ponta
    var medias = series.map(function (s) { return { s: s, m: mediaHist(s.g) }; })
                       .filter(function (x) { return x.m !== null; });
    medias.forEach(function (x) {
      ctx.strokeStyle = x.s.cor; ctx.lineWidth = 1.2; ctx.globalAlpha = 0.8;
      ctx.setLineDash([5, 4]); ctx.beginPath();
      ctx.moveTo(L, Y(x.m)); ctx.lineTo(w - R, Y(x.m)); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    });
    // rotulo acima da linha; se as duas medias estao perto, um rotulo so
    ctx.font = "600 11px Poppins, Arial"; ctx.textAlign = "left";
    // com fundo: a serie cruza a linha da media, e o texto sumia embaixo dela
    function rotulo(txt, y, corTxt) {
      var lw = ctx.measureText(txt).width;
      ctx.fillStyle = cor("--card"); ctx.globalAlpha = 0.92;
      ctx.fillRect(L + 3, y - 11, lw + 8, 15); ctx.globalAlpha = 1;
      ctx.fillStyle = corTxt; ctx.fillText(txt, L + 7, y);
    }
    var perto = medias.length === 2 && Math.abs(Y(medias[0].m) - Y(medias[1].m)) < 16;
    if (perto) {
      rotulo("média histórica: Ibovespa " + num(medias[1].m) + " · Mercado " + num(medias[0].m),
             Math.min(Y(medias[0].m), Y(medias[1].m)) - 6, cor("--ink-2"));
    } else {
      medias.forEach(function (x) {
        rotulo("média " + x.s.nome.toLowerCase() + " " + num(x.m), Y(x.m) - 6, x.s.cor);
      });
    }
    ctx.font = "11px Poppins, Arial";
    // o ponto de HOJE (preco de hoje, lucro de 12 meses do ultimo balanco)
    series.forEach(function (s) {
      var v = DADOS.atual[s.g] ? DADOS.atual[s.g][MEDIDA] : null;
      if (v === null || v === undefined) return;
      ctx.fillStyle = s.cor; ctx.beginPath(); ctx.arc(X(t1), Y(v), 3.5, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = cor("--ink-2"); ctx.textAlign = "right"; ctx.fillText("hoje", X(t1), T - 2);
    GEOM = { series: series, X: X, Y: Y, L: L, R: R, T: T, H: H, w: w };
  }

  // dica: a semana mais perto do mouse, com o valor das duas series
  function dica(ev) {
    if (!GEOM) return;
    var box = $("chart").getBoundingClientRect(), mx = ev.clientX - box.left;
    if (mx < GEOM.L || mx > GEOM.w - GEOM.R) { $("dica").hidden = true; return; }
    var ref = GEOM.series[0].p, melhor = null, dist = Infinity;
    ref.forEach(function (p, i) { var d = Math.abs(GEOM.X(p[0]) - mx); if (d < dist) { dist = d; melhor = i; } });
    if (melhor === null) return;
    var data = ref[melhor][2], linhas = GEOM.series.map(function (s) {
      var p = s.p.filter(function (q) { return q[2] === data; })[0];
      return '<span><i style="background:' + s.cor + '"></i>' + s.nome + " " + num(p ? p[1] : null) + "</span>";
    });
    var el = $("dica");
    el.innerHTML = "<b>" + data.split("-").reverse().join("/") + "</b>" + linhas.join("<br>");
    el.hidden = false;
    var x = GEOM.X(ref[melhor][0]);
    el.style.left = Math.min(Math.max(x + 10, 0), box.width - el.offsetWidth - 4) + "px";
  }

  var NOME_MEDIDA = { pl_lucrativas: "só lucrativas", pl: "com prejuízos", pl_mediana: "mediana" };

  // por ano: fechamento, minimo, maximo e media das semanas, na medida do
  // botao; a primeira linha e o ATUAL (preco de hoje, faixa do ano ate hoje)
  function tabela() {
    function c(v, extra) {
      return '<td class="' + (extra || "") + (v > TETO_EIXO ? " alto" : "") + '">' + num(v) + "</td>";
    }
    function blocos(g, ponto, sep) {
      var s = (g && g.semanal && g.semanal[MEDIDA]) || {};
      return c(ponto, sep) + c(s.min) + c(s.max) + c(s.media);
    }
    var a = DADOS.atual, linhas = [];
    linhas.push('<tr class="atual"><td>Atual</td>' +
      blocos(a.ibov, a.ibov ? a.ibov[MEDIDA] : null, "sep") +
      blocos(a.mercado, a.mercado ? a.mercado[MEDIDA] : null, "sep") +
      '<td class="sep">' + ((a.mercado && a.mercado.n) || "—") + "</td><td>" +
      num(a.mercado && a.mercado.valor_mercado / 1e12, 2) + "</td><td>—</td></tr>");
    Object.keys(DADOS.anos).sort().reverse().forEach(function (y) {
      var m = DADOS.anos[y].mercado || {}, i = DADOS.anos[y].ibov || {};
      linhas.push("<tr><td>" + y + "</td>" + blocos(i, i[MEDIDA], "sep") + blocos(m, m[MEDIDA], "sep") +
        '<td class="sep">' + (m.n || "—") + "</td><td>" + num(m.valor_mercado / 1e12, 2) +
        "</td><td>" + num(m.cobertura_volume) + "%</td></tr>");
    });
    var cab = "<th>Fech.</th><th>Mín.</th><th>Máx.</th><th>Média</th>";
    $("tabela").innerHTML = "<thead><tr><th></th>" +
      '<th class="grupo sep" colspan="4">Ibovespa</th><th class="grupo sep" colspan="4">Mercado</th>' +
      '<th class="grupo sep" colspan="3">Mercado</th></tr><tr><th>Ano</th>' +
      cab.replace("<th>", '<th class="sep">') + cab.replace("<th>", '<th class="sep">') +
      '<th class="sep">Empresas</th><th>Valor (R$ tri)</th><th>Cobertura</th></tr></thead><tbody>' +
      linhas.join("") + "</tbody>";
    var corrente = a.ano_corrente ? " (" + a.ano_corrente + " até hoje)" : "";
    $("titulo-tabela").textContent = "P/L " + NOME_MEDIDA[MEDIDA] +
      " — fechamento, mínima, máxima e média das semanas do ano" + corrente;
  }

  // os cartoes seguem a medida do botao, como o grafico e a tabela
  function cartoes() {
    var a = DADOS.atual, ib = a.ibov || {}, me = a.mercado || {};
    var mi = mediaHist("ibov"), mm = mediaHist("mercado");
    function contra(hoje, media) {
      if (hoje === null || hoje === undefined || media === null) return "";
      var d = (hoje / media - 1) * 100;
      return (d < 0 ? num(-d, 0) + "% abaixo" : num(d, 0) + "% acima") + " da média";
    }
    var sub = MEDIDA === "pl" ? "todas as empresas" : MEDIDA === "pl_mediana" ? "a empresa típica" : null;
    $("cartoes").innerHTML = [
      ["Mercado hoje", num(me[MEDIDA]),
       (sub || (me.n - me.n_prejuizo) + " empresas lucrativas") + " · " + contra(me[MEDIDA], mm)],
      ["Ibovespa hoje", num(ib[MEDIDA]),
       (sub || (ib.n - ib.n_prejuizo) + " empresas lucrativas") + " · " + contra(ib[MEDIDA], mi)],
      ["Média histórica desde 2010", "Ibov " + num(mi) + " · Merc. " + num(mm),
       "média das " + ((DADOS.semanas.ibov || []).length) + " semanas, " + NOME_MEDIDA[MEDIDA]],
      ["Ibovespa, peso do índice", num(ib.pl_ponderado_indice),
       "quantidade teórica × preço ÷ quantidade × LPA"]
    ].map(function (c, i) {
      return '<div class="cartao"><div class="rot">' + c[0] + '</div><div class="v' +
             (i === 2 ? " menor" : "") + '">' + c[1] + '</div><div class="n">' + c[2] + "</div></div>";
    }).join("");
  }

  function montar() {
    var a = DADOS.atual;
    cartoes();
    tabela();

    var val = DADOS.validacao_ibov || {}, ult = Object.keys(val).sort()[0];
    $("notas").innerHTML =
      "<p><b>P/L</b> é a soma do valor de mercado dividida pela soma do lucro do controlador, contando " +
      "<b>só as empresas lucrativas</b>. É a convenção de quem publica o P/L da bolsa, e o formato bate " +
      "com o histórico do Oceans14. <b>Com prejuízos</b> soma também quem perdeu dinheiro: é o P/L " +
      "de quem comprasse um pedaço de todas as empresas, mas um ano de prejuízo grande zera o " +
      "denominador. Em 2015, os prejuízos de Petrobras e Vale levam essa leitura a 94. A " +
      "<b>mediana</b> mostra a empresa típica e não é puxada pelas gigantes.</p>" +
      "<p><b>Cada semana usa o preço do último pregão dela</b> e o lucro de 12 meses até ali, " +
      "aproximado pela mistura dos dois exercícios: no meio do ano, metade do lucro do ano anterior e metade " +
      "do lucro do ano. Na última semana do ano isso é o lucro do próprio exercício, então o " +
      "<b>fechamento</b> da tabela é o P/L do ano. Esse lucro ainda não era público na data, então não é o " +
      "P/L que alguém via na tela naquele dia. Mínima, máxima e média são das semanas do ano. A contagem de " +
      "ações de cada semana é a do balanço levada pelos desdobramentos e grupamentos até ela. O ponto " +
      "<b>hoje</b> é o preço atual com o lucro dos últimos 12 meses publicado.</p>" +
      "<p><b>Média histórica</b> é a média simples de todas as semanas desde 2010, na leitura " +
      "escolhida. Na leitura com prejuízos, as semanas em que o lucro somado da bolsa foi negativo ficam " +
      "fora, e as de 2015 e 2016, com lucro perto de zero, puxam a média para cima.</p>" +
      "<p><b>A carteira do Ibovespa de cada ano é reconstruída</b> pela regra atual da B3: os papéis que " +
      "somam 85% do índice de negociabilidade, com presença em 95% dos pregões e sem penny stock. A B3 " +
      "não publica a carteira histórica em fonte aberta." +
      (ult ? " Contra a carteira oficial de hoje, a reconstrução de " + ult + " acerta " +
             num(val[ult].acerto_pct) + "% dos papéis." : "") +
      " Antes de 2014 a regra oficial era outra, então esses anos mostram “o que o Ibovespa de hoje teria sido”.</p>" +
      "<p><b>Cobertura</b> é a parte do volume negociado no ano que casou com uma empresa da base. " +
      "Antes de 2020 a contagem de ações é menos confiável. Empresas com valor de mercado " +
      "incompatível com o balanço (P/VP fora de 0,01–200 ou valor acima de 50× o ativo) ficam fora da " +
      "conta, porque uma única delas distorce a soma do ano.</p>" +
      "<p>Dados de " + (a.data || "—") + ". Fontes: DFP/ITR da CVM e COTAHIST da B3.</p>";
    desenhar();
  }

  document.querySelectorAll(".controles button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll(".controles button").forEach(function (x) { x.classList.remove("ativo"); });
      b.classList.add("ativo"); MEDIDA = b.getAttribute("data-m"); desenhar(); tabela(); cartoes();
    });
  });
  window.addEventListener("resize", function () { if (DADOS) desenhar(); });
  $("chart").addEventListener("mousemove", dica);
  $("chart").addEventListener("mouseleave", function () { $("dica").hidden = true; });

  fetch("bolsa.json").then(function (r) { return r.json(); }).then(function (d) {
    DADOS = d; montar();
  }).catch(function () {
    $("cartoes").innerHTML = '<p class="erro">Não foi possível carregar bolsa.json.</p>';
  });
})();
</script>
</body>
</html>
