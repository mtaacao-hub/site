<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Raio-X da Ação — Muita Ação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Mesma identidade da marca, invertida: o marinho deixa de ser fundo e
       passa a ser tinta. O fundo e um off-white levemente quente, derivado
       do creme da marca, pra que o cartao branco puro se destaque dele sem
       precisar de borda forte nem sombra. */
    --ground:#FAF8F4; --card:#FFFFFF;
    --ink:#10233B; --ink-2:#4F6179; --ink-3:#8795A6;
    --gold:#C9A227; --gold-ink:#8A6D12;     /* o dourado nao tem contraste pra texto pequeno no branco */
    --line:#E8E3D9; --line-forte:#D8D2C4;
    --verde:#1C7F4D; --vermelho:#B5392B;    /* escurecidos pra ler no claro */
    --font:"Poppins",Arial,Helvetica,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--ground);color:var(--ink);
       font-family:var(--font);padding:0 16px 70px;font-size:14px;
       -webkit-font-smoothing:antialiased}
  .wrap{max-width:1120px;margin:0 auto}
  a{color:var(--gold-ink)}

  header.topo{display:flex;align-items:center;gap:11px;flex-wrap:wrap;
    position:sticky;top:0;z-index:5;padding:14px 0;margin-bottom:22px;
    background:var(--ground);border-bottom:1px solid var(--line)}
  .marca{font-weight:800;color:var(--ink);font-size:.95rem;letter-spacing:.01em}
  .busca{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .voltar{font-size:.82rem;font-weight:700;color:var(--ink-2);text-decoration:none}
  .voltar:hover{color:var(--gold-ink)}
  .voltar[hidden],#conteudo[hidden],#vista-lista[hidden]{display:none}
  /* a lista e a pagina principal: o subsetor sai a esquerda, como o nome */
  #vista-lista th:nth-child(3),#vista-lista td:nth-child(3){text-align:left;max-width:170px;
    overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
  .lista-conta{font-size:.78rem;color:var(--ink-3);margin:10px 2px 0}
  input[type=search]{min-width:230px;padding:10px 14px;border-radius:9px;font-family:var(--font);
    font-size:.95rem;background:var(--card);border:1px solid var(--line-forte);color:var(--ink)}
  input[type=search]::placeholder{color:var(--ink-3)}
  input[type=search]:focus{outline:2px solid var(--gold);outline-offset:1px}

  /* ---------- cabecalho da empresa ---------- */
  /* Sem cartao: o nome da empresa e a cotacao sao o topo da pagina, nao um
     bloco dentro dela. So uma regra fina embaixo. */
  .ficha{padding:4px 2px 16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
  .ficha .linha1{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .papel{font-size:2rem;font-weight:800;color:var(--ink);letter-spacing:-.01em;line-height:1.1}
  .empresa{font-size:1rem;color:var(--ink-2)}
  .setor{font-size:.8rem;color:var(--ink-3)}
  .cotacao{margin-left:auto;text-align:right}
  .cotacao .v{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .cotacao .d{font-size:.78rem;color:var(--ink-3);display:block}
  .avisos{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .tag{font-size:.7rem;padding:4px 10px;border-radius:20px;border:1px solid var(--line-forte);
    background:var(--card);color:var(--ink-2)}
  .tag.alerta{border-color:rgba(181,57,43,.35);background:#FDF4F2;color:var(--vermelho)}

  /* ---------- grafico ---------- */
  .grafico{border:1px solid var(--line);border-radius:14px;padding:16px 18px 10px;
    background:var(--card);margin-bottom:22px}
  .periodos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .periodos button{background:var(--card);border:1px solid var(--line-forte);color:var(--ink-2);
    padding:6px 13px;border-radius:8px;cursor:pointer;font-family:var(--font);font-size:.78rem;
    font-weight:600;transition:.15s}
  .periodos button:hover{border-color:var(--gold);color:var(--ink)}
  .periodos button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
  canvas{width:100%;height:260px;display:block;touch-action:pan-y}
  .resumo-grafico{display:flex;gap:20px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-3);
    padding:10px 2px 2px}
  .resumo-grafico b{color:var(--ink);font-variant-numeric:tabular-nums}

  /* ---------- precos de valuation ---------- */
  .valuation{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;
    margin-bottom:18px}
  .metodo{border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:var(--card)}
  /* o unico lugar onde o dourado e preenchimento: o numero que resume os outros */
  .metodo.media{border-color:var(--gold);background:#FFFCF2}
  /* com sete metodos a Media sobrava sozinha numa segunda linha: vira uma
     faixa de largura inteira, embaixo, que e o papel dela (o resumo) */
  .valuation .metodo.media{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px}
  .valuation .metodo.media .nome{flex-basis:100%}
  .metodo .nome{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--gold-ink);
    font-weight:700}
  .metodo .preco{font-size:1.35rem;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
  .metodo .margem{font-size:.8rem;font-weight:700;margin-top:3px}
  .metodo .nota{font-size:.68rem;color:var(--ink-3);margin-top:7px;line-height:1.45}
  .pos{color:var(--verde)} .neg{color:var(--vermelho)} .na{color:var(--ink-3)}

  /* ---------- paineis de indicadores ---------- */
  /* 300px: o rotulo mais longo ("Margem EBIT recorrente" + icone, ~200px) cabe numa linha
     ao lado do valor mais largo do painel; min() para nao estourar celular estreito */
  .paineis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:14px}
  .painel{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:15px 14px}
  .painel h3{margin:0 0 12px;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;
    color:var(--gold-ink);font-weight:700}
  .painel dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:baseline}
  .painel dt,.painel dd{padding:6px 0;border-top:1px solid var(--line)}
  .painel dt:first-of-type,.painel dd:first-of-type{border-top:0;padding-top:0}
  /* flex: o icone do historico fica sempre ao lado do rotulo, nunca sozinho na 2a linha */
  .painel dt{color:var(--ink-2);font-size:.8rem;display:flex;align-items:center}
  .painel dt .hist{flex:none}
  .painel dd .sob{display:block;font-size:.66rem;font-weight:500;line-height:1.2;margin-top:1px}
  .painel dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;font-size:.88rem}

  /* ---------- lista ---------- */
  .lista{border:1px solid var(--line);border-radius:12px;background:var(--card);
    overflow-x:auto;margin-top:12px}
  table{width:100%;border-collapse:collapse;font-size:.84rem;min-width:620px}
  th{text-align:right;padding:11px 10px;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink-2);background:var(--card);border-bottom:1px solid var(--line-forte);
    cursor:pointer;white-space:nowrap;user-select:none;position:sticky;top:0}
  th:hover{color:var(--gold-ink)}
  th:first-child,th:nth-child(2){text-align:left}
  td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);
    font-variant-numeric:tabular-nums;white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  td:first-child{text-align:left;font-weight:700;color:var(--ink);cursor:pointer}
  td:nth-child(2){text-align:left;color:var(--ink-2);max-width:210px;overflow:hidden;text-overflow:ellipsis}
  tbody tr:hover{background:#FFFBEF;cursor:pointer}

  .rodape{margin-top:26px;padding:16px 18px;border-radius:11px;background:var(--card);
    border:1px solid var(--line);font-size:.76rem;line-height:1.7;color:var(--ink-2)}
  .rodape b{color:var(--ink)}
  h2.sec{font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);
    margin:28px 0 11px;font-weight:700}
  .carregando{padding:50px;text-align:center;color:var(--ink-3)}

  /* ---------- abas ---------- */
  /* no celular as abas nao cabem: rolam dentro da faixa, sem empurrar a pagina para o lado */
  .abas{display:flex;gap:4px;margin:28px 0 14px;box-shadow:inset 0 -1px 0 var(--line);
    overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .abas::-webkit-scrollbar{display:none}
  .abas button{white-space:nowrap;flex:none}
  .abas button{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-3);
    padding:9px 15px;cursor:pointer;font-family:var(--font);font-size:.82rem;font-weight:700;
    letter-spacing:.02em;transition:.15s}
  .abas button:hover{color:var(--ink)}
  .abas button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--gold)}
  .aba-sub{color:var(--ink-2);font-size:.82rem;margin:0 0 12px}

  /* ---------- graficos anuais ---------- */
  .graficos{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
  .topo-bloco{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .mini-periodo{display:flex;gap:2px;background:#F3EFE6;border-radius:8px;padding:2px}
  .mini-periodo button{font-family:var(--font);font-size:.7rem;padding:3px 8px;border:0;border-radius:6px;
    background:none;color:var(--ink-2);cursor:pointer}
  .mini-periodo button.ativo{background:var(--card);color:var(--ink);font-weight:600;
    box-shadow:0 1px 2px rgba(16,35,59,.12)}
  .nota-periodo{font-size:.76rem;color:var(--ink-3);margin-left:6px}
  /* "Agrupar por ano" dos proventos, como no Status Invest */
  .agrupa{display:inline-flex;align-items:center;gap:5px;font-size:.7rem;color:var(--ink-2);
    cursor:pointer;margin-left:auto;user-select:none}
  .agrupa input{accent-color:var(--ink);margin:0;cursor:pointer}
  .bloco{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:15px 17px 10px}
  .bloco h3{margin:0 0 2px;font-size:.84rem;font-weight:700;color:var(--ink)}
  .bloco .sub{font-size:.7rem;color:var(--ink-3);margin-bottom:8px}
  .bloco canvas{height:190px}
  .legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.7rem;color:var(--ink-2);padding:4px 0 2px}
  .legenda i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;
    vertical-align:baseline}
  .vazio{padding:28px 6px;text-align:center;color:var(--ink-3);font-size:.8rem}

  /* ---------- historico do indicador ---------- */
  .hist{border:1px solid var(--line-forte);background:var(--card);border-radius:6px;
    padding:1px 4px 0;margin-left:5px;cursor:pointer;line-height:0;vertical-align:middle;
    color:var(--ink-3);transition:.15s}
  .hist:hover{border-color:var(--gold);color:var(--gold-ink)}
  .hist svg{display:block}
  .modal{position:fixed;inset:0;z-index:20;background:rgba(16,35,59,.42);
    display:flex;align-items:center;justify-content:center;padding:16px}
  /* o display:flex acima ganha do [hidden] do navegador por especificidade:
     sem esta linha o modal nasce aberto */
  .modal[hidden]{display:none}
  .modal .caixa{background:var(--card);border-radius:14px;max-width:720px;width:100%;
    max-height:92vh;overflow-y:auto;border:1px solid var(--line-forte)}
  .modal header{display:flex;align-items:center;gap:12px;padding:18px 22px 14px}
  .modal h3{margin:0;font-size:1.25rem;font-weight:800;color:var(--ink)}
  .modal .fechar{margin-left:auto;border:0;background:var(--ground);color:var(--ink-2);
    width:34px;height:34px;border-radius:50%;font-size:1.2rem;cursor:pointer;line-height:1}
  .modal .fechar:hover{background:var(--ink);color:#fff}
  .sumario{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:1px;background:var(--line);border-top:1px solid var(--line);
    border-bottom:1px solid var(--line)}
  .sumario div{background:var(--card);padding:13px 22px}
  .sumario dt{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);
    font-weight:700}
  .sumario dd{margin:3px 0 0;font-size:1.3rem;font-weight:800;font-variant-numeric:tabular-nums}
  .sumario .obs{font-size:.72rem;font-weight:600;color:var(--ink-2);padding:0;background:none}
  /* .pos/.neg sozinhas perdem pra .sumario .obs na especificidade */
  .sumario .obs.pos{color:var(--verde)} .sumario .obs.neg{color:var(--vermelho)}
  #modal-chart{height:300px;padding:6px 10px 0}
  .modal .nota{padding:4px 22px 18px;font-size:.72rem;color:var(--ink-3);line-height:1.6}
  /* rotulo da barra ao passar o mouse ou tocar (como no Status) */
  .dica{position:fixed;z-index:40;pointer-events:none;background:rgba(16,35,59,.94);color:#fff;
    font-size:.72rem;padding:6px 10px;border-radius:7px;white-space:nowrap;display:none;
    box-shadow:0 2px 8px rgba(16,35,59,.25)}
  .dica b{display:block;font-size:.9rem;font-weight:700;font-variant-numeric:tabular-nums}
  td a.lk{color:inherit;text-decoration:none}
  td a.lk:hover{text-decoration:underline}
</style>
</head>
<body>
<script src="menu.js"></script>
<script src="aovivo.js"></script>
<script src="filtros.js"></script>
<script src="documentos.js"></script>
<div class="wrap">

  <header class="topo">
    <a class="voltar" id="voltar" href="acoes.html" hidden>&larr; Todas as ações</a>
    <div class="busca">
      <input type="search" id="busca" placeholder="Ticker, empresa ou setor…" list="tickers" autocomplete="off" spellcheck="false">
      <datalist id="tickers"></datalist>
    </div>
  </header>

  <div id="conteudo"><div class="carregando">Carregando a base…</div></div>

  <section id="vista-lista" hidden>
  <h2 class="sec" id="tit-lista">Ações</h2>
  <div id="filtros"></div>
  <p class="lista-conta" id="lista-conta"></p>
  <div class="lista">
    <table>
      <thead><tr id="cabeca"></tr></thead>
      <tbody id="corpo"><tr><td colspan="14" class="carregando">…</td></tr></tbody>
    </table>
  </div>
  </section>

  <div class="rodape" id="rodape"></div>
</div>

<div class="modal" id="modal" hidden>
  <div class="caixa" role="dialog" aria-modal="true" aria-labelledby="modal-tit">
    <header><h3 id="modal-tit"></h3>
      <button class="fechar" id="modal-fechar" aria-label="Fechar">&times;</button></header>
    <div class="sumario" id="modal-sumario"></div>
    <canvas id="modal-chart"></canvas>
    <p class="nota" id="modal-nota"></p>
  </div>
</div>

<script>
(function () {
  "use strict";
  var BASE = null, HIST = {}, SERIES = {}, LISTA = [], ATUAL = null, PERIODO = 365;
  // Uma cor so pra linha. Verde/vermelho conforme a variacao do periodo dava
  // a impressao de que a cor mudava sozinha: o redesenho do resize usava
  // verde fixo, e no celular rolar a tela recolhe a barra de endereco e
  // dispara resize. A variacao continua colorida no texto embaixo do
  // grafico, que e onde ela e um numero e nao um grafismo.
  var COR_LINHA = "#10233B";
  var ordem = { col: "volume", asc: false };
  var $ = function (id) { return document.getElementById(id); };

  // ---------- formatacao ----------
  function brl(v, casas) {
    if (v === null || v === undefined || !isFinite(v)) return null;
    return v.toLocaleString("pt-BR", { minimumFractionDigits: casas === undefined ? 2 : casas,
                                       maximumFractionDigits: casas === undefined ? 2 : casas });
  }
  function num(v, casas, sufixo) {
    var s = brl(v, casas);
    return s === null ? '<span class="na">—</span>' : s + (sufixo || "");
  }
  function esc(s) {
    return String(s === undefined || s === null ? "" : s).replace(/[&<>"']/g, function (m) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m];
    });
  }
  function dataBR(iso) {
    if (!iso) return "—";
    var p = String(iso).slice(0, 10).split("-");
    return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : iso;
  }

  // ---------- precos pelos metodos de valuation ----------
  // As premissas sao as classicas de cada autor, fixas aqui: a calculadora
  // dedicada e o lugar de mexer nelas. O que muda entre empresas sao os
  // fundamentos, nao as premissas.
  var YIELD_BAZIN = 6, DESCONTO = 12, PERPETUIDADE = 4;
  // `m` e o bloco de mercado do papel: numa UNIT o preco e de um pacote de
  // acoes e os fundamentos sao por acao, entao o teto e multiplicado por
  // acoes_por_unit. Mesma regra no carteira.html.
  function precos(r, m) {
    var saida = {}, dpa = r.dpa_60m !== undefined ? r.dpa_60m : r.dpa_declarado;
    if (dpa > 0) saida.Bazin = dpa / (YIELD_BAZIN / 100);
    if (r.lpa_ttm_calc > 0 && r.vpa_atual > 0)
      saida.Graham = Math.sqrt(22.5 * r.lpa_ttm_calc * r.vpa_atual);
    var g = r.cagr_60m;
    // crescimento LIMITADO a 25%, como no DCF: com a janela de 5 anos de
    // verdade, lucro baixo em 2020 (pandemia) dava PETR4 com g de 77,7% e
    // Lynch de 846. Mesma regra no carteira.html.
    if (r.lpa_ttm_calc > 0 && g > 0) saida.Lynch = r.lpa_ttm_calc * Math.min(g, 25);
    if (r.fcl_acao > 0 && g !== undefined && g !== null) {
      var cresc = Math.max(0, Math.min(g, 25)) / 100, taxa = DESCONTO / 100, perp = PERPETUIDADE / 100;
      if (perp < taxa) {
        var fluxo = r.fcl_acao, soma = 0, i;
        for (i = 1; i <= 5; i++) { fluxo *= (1 + cresc); soma += fluxo / Math.pow(1 + taxa, i); }
        saida.DCF = soma + (fluxo * (1 + perp)) / (taxa - perp) / Math.pow(1 + taxa, 5);
      }
    }
    // P/L HISTORICO: o preco se a acao voltasse ao P/L de costume dela -- LPA
    // de hoje x mediana do P/L dos ultimos 10 exercicios (pipeline:
    // extrair_series.pl_historico). Mesma regra no carteira.html.
    var ph = r.pl_historico && r.pl_historico.mediana;
    if (r.lpa_ttm_calc > 0 && ph > 0) saida["P/L histórico"] = r.lpa_ttm_calc * ph;
    // P/VP HISTORICO: o mesmo, sobre o patrimonio -- VPA de hoje x mediana do
    // P/VP dos ultimos 10 exercicios. Mesma regra no carteira.html.
    var pvh = r.pvp_historico && r.pvp_historico.mediana;
    if (r.vpa_atual > 0 && pvh > 0) saida["P/VP histórico"] = r.vpa_atual * pvh;
    var vals = Object.keys(saida).map(function (k) { return saida[k]; })
                     .filter(function (v) { return isFinite(v) && v > 0; });
    if (vals.length) saida["Média"] = vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
    var k = (m && m.acoes_por_unit) || 1;
    if (k !== 1) Object.keys(saida).forEach(function (n) { saida[n] *= k; });
    return saida;
  }

  // ---------- grafico ----------
  function desenhar(canvas, serie, cor, opt) {
    opt = opt || {};
    var dpr = window.devicePixelRatio || 1;
    var L = canvas.clientWidth, A = canvas.clientHeight;
    canvas.width = L * dpr; canvas.height = A * dpr;
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, L, A);
    if (!serie || serie.length < 2) {
      ctx.fillStyle = "rgba(16,35,59,.42)"; ctx.font = "13px Poppins, Arial";
      ctx.fillText("Sem histórico para este período.", 12, A / 2);
      canvas._linha = null;
      return;
    }
    var mg = { e: 52, d: 10, t: 14, b: 22 };
    var precosArr = serie.map(function (p) { return p[1]; });
    var min = Math.min.apply(null, precosArr), max = Math.max.apply(null, precosArr);
    if (max === min) { max += 1; min -= 1; }
    var folga = (max - min) * 0.08; min -= folga; max += folga;
    if (opt.ref !== undefined && opt.ref !== null) { min = Math.min(min, opt.ref); max = Math.max(max, opt.ref); }
    if (min < 0 && Math.min.apply(null, precosArr) >= 0) min = 0;   // preco nao e negativo (HDEL11: eixo ia a -4,88)
    var px = function (i) { return mg.e + (L - mg.e - mg.d) * (i / (serie.length - 1)); };
    var py = function (v) { return mg.t + (A - mg.t - mg.b) * (1 - (v - min) / (max - min)); };

    // grade e escala
    ctx.strokeStyle = "rgba(16,35,59,.10)"; ctx.fillStyle = "rgba(16,35,59,.48)";
    ctx.font = "10px Poppins, Arial"; ctx.lineWidth = 1;
    for (var k = 0; k <= 4; k++) {

                    tri: function (v) { return [{ nome: "Resultado financeiro", cor: COR.cinza, valores: v.milhoes("res_fin") }]; } });
      }
      defs.push({ c: "margens", t: "Margens", s: "% da receita",
                  series: [{ nome: "Bruta", tipo: "linha", cor: COR.cinza,
                             valores: razao("resultado_bruto", "receita") },
                           { nome: "EBIT", tipo: "linha", cor: COR.ouro,
                             valores: razao("ebit_contabil", "receita") },
                           { nome: "Líquida", tipo: "linha", cor: COR.verde,
                             valores: razao("lucro_ctrl", "receita") }],
                  tri: function (v) { return [{ nome: "EBIT", tipo: "linha", cor: COR.ouro, valores: v.margem("ebit") },
                                              { nome: "Líquida", tipo: "linha", cor: COR.verde, valores: v.margem("lucro") }]; } });
    }
    defs.push({ c: "patrimonio", t: "Patrimônio líquido e ativo", s: "R$ milhões",
                series: [{ nome: "Ativo", cor: COR.cinza, valores: col("ativo_total", milhoes) },
                         { nome: "Patrimônio", cor: COR.azul, valores: col("pl", milhoes) }] });
    if (!fin) {
      defs.push({ c: "divida", t: "Dívida", s: "R$ milhões",
                  series: [{ nome: "Bruta", cor: COR.cinza, valores: col("divida_bruta", milhoes) },
                           { nome: "Líquida", tipo: "linha", cor: COR.vermelho,
                             valores: col("divida_liquida", milhoes) }] });
      defs.push({ c: "caixa", t: "Caixa gerado e investido", s: "R$ milhões",
                  series: [{ nome: "Operacional", cor: COR.verde, valores: col("fco", milhoes) },
                           { nome: "CAPEX", cor: COR.vermelho, valores: col("capex", milhoes) }] });
    }
    var retorno = [{ nome: "ROE", cor: COR.azul, valores: razao("lucro_ctrl", "pl") }];
    if (!fin) {
      retorno.push({ nome: "ROIC", cor: COR.ouro,
                     valores: razao("ebit_contabil", "capital_empregado") });
    }
    defs.push({ c: "retorno", t: "Retorno", s: "% ao ano", series: retorno });

    // a visao de cada grafico no modo escolhido
    function visao(d) {
      if (d.modos) {
        var m = MODO_GRA[d.c] || d.padrao, r = d.modos[m]();
        return { modo: m, rotulos: r.rotulos, series: r.series, trimestral: false, parcial: r.parcial };
      }
      var modo = (temTrim && d.tri) ? (MODO_GRA[d.c] || "ano") : "ano";
      if (modo !== "ano") {
        var v = visaoTrim(cnpj, modo);
        if (v) return { modo: modo, rotulos: v.rotulos, series: d.tri(v), trimestral: true };
      }
      return { modo: "ano", rotulos: anos, series: d.series, trimestral: false };
    }
    function temDado(series) {
      return series.some(function (x) {
        return x.valores.some(function (v) { return v !== null && isFinite(v); });
      });
    }

    // grafico sem dado nenhum e pior que grafico ausente: o Itau so publica
    // lucro, proventos e patrimonio na nossa base, e o resto sairia em branco
    // (vale nos dois modos: o resultado financeiro so existe no trimestral)
    defs = defs.filter(function (d) {
      return temDado(d.series) || (temTrim && d.tri && temDado(d.tri(visaoTrim(cnpj, "tri"))));
    });
    if (!defs.length) {
      $("aba-gra").innerHTML = '<div class="vazio">Sem histórico anual suficiente ' +
        'para esta empresa.</div>';
      GRAFICOS = [];
      return;
    }
    var vistas = defs.map(visao);
    $("aba-gra").innerHTML =
      (TRIM || TRIM_FALHOU ? "" : '<div class="nota-periodo">Carregando o histórico trimestral…</div>') +
      '<div class="graficos">' + defs.map(function (d, i) {
      var vi = vistas[i];
      var leg = vi.series.map(function (x) {
        return '<span><i style="background:' + x.cor + '"></i>' + esc(x.nome) + "</span>";
      }).join("");
      var nomes = d.modos ? d.nomes : NOME_MODO;
      var seletor = (d.modos || (temTrim && d.tri))
        ? '<div class="mini-periodo" data-g="' + esc(d.c) + '">' + Object.keys(nomes).map(function (m) {
            return '<button data-m="' + m + '"' + (vi.modo === m ? ' class="ativo"' : "") + ">" +
                   nomes[m] + "</button>";
          }).join("") + "</div>"
        : "";
      var sub = d.s + (vi.modo === "tri" ? " · trimestre isolado" : vi.modo === "ttm" ? " · 12 meses em cada trimestre" : "") +
                (vi.parcial ? " · " + new Date().getFullYear() + " até agora" : "");
      if (d.agrupa) leg += '<label class="agrupa"><input type="checkbox" data-agrupa' +
                           (AGRUPA_PROV ? " checked" : "") + '> Agrupar por ano</label>';
      return '<div class="bloco"><div class="topo-bloco"><h3>' + esc(d.t) + "</h3>" + seletor + "</div>" +
        '<div class="sub">' + esc(sub) + "</div>" +
        '<canvas id="g' + i + '"></canvas>' +
        '<div class="legenda">' + leg + "</div></div>";
    }).join("") + "</div>";
    var cx = document.querySelector("#aba-gra [data-agrupa]");
    if (cx) cx.addEventListener("change", function () { AGRUPA_PROV = cx.checked; montarGraficos(ITEM_GRA); });
    Array.prototype.forEach.call(document.querySelectorAll("#aba-gra .mini-periodo"), function (el) {
      el.addEventListener("click", function (ev) {
        var b = ev.target.closest("button");
        if (!b) return;
        MODO_GRA[el.dataset.g] = b.dataset.m;
        montarGraficos(ITEM_GRA);
      });
    });
    GRAFICOS = vistas.map(function (vi, i) {
      // proventos em R$ por acao com 4 casas, como o Status; o resto pelo tamanho
      var prov = defs[i].c === "dividendos";
      return { id: "g" + i, anos: vi.rotulos, series: vi.series, trimestral: vi.trimestral,
               casas: prov ? 4 : null, moeda: prov };
    });
    redesenharGraficos();
  }

  function redesenharGraficos() {
    GRAFICOS.forEach(function (g) {
      var c = $(g.id);
      if (c && c.clientWidth) barras(c, g.anos, g.series, { trimestral: g.trimestral, casas: g.casas, moeda: g.moeda });
    });
  }

  // ---------- historico de um indicador ----------
  // Indicador em porcentagem: a diferenca vira "pp" e o valor leva "%".
  var EM_PCT = { "ROE": 1, "ROIC": 1, "Margem bruta": 1, "Margem EBIT": 1,
                 "Margem EBIT contábil": 1, "Margem EBITDA": 1,
                 "Margem líquida": 1, "Dividend yield": 1, "Payout": 1 };

  function botaoHist(chave) {
    return '<button class="hist" data-ind="' + esc(chave) + '" aria-label="Histórico de ' +
      esc(chave) + '"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">' +
      '<polyline points="3,17 9,11 13,15 21,6"/></svg></button>';
  }

  function valorHist(v, chave) {
    return brl(v, 2) + (EM_PCT[chave] ? "%" : "");
  }

  function desenharSerie(canvas, pontos, chave) {
    var dpr = window.devicePixelRatio || 1;
    var L = canvas.clientWidth, A = canvas.clientHeight;
    canvas.width = L * dpr; canvas.height = A * dpr;
    var ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, L, A);

    var vals = pontos.map(function (p) { return p[1]; });
    var media = vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
    var min = Math.min.apply(null, vals.concat([media]));
    var max = Math.max.apply(null, vals.concat([media]));
    if (max === min) { max += 1; min -= 1; }
    // folga maior em cima: e onde ficam os rotulos de valor
    var folga = (max - min) * 0.18;
    min -= folga * 0.7; max += folga;
    var mg = { e: 22, d: 22, t: 18, b: 30 };
    var px = function (i) {
      return pontos.length === 1 ? L / 2
        : mg.e + (L - mg.e - mg.d) * (i / (pontos.length - 1));
    };
    var py = function (v) { return mg.t + (A - mg.t - mg.b) * (1 - (v - min) / (max - min)); };

    // linha da media, tracejada, como referencia visual
    ctx.save();
    ctx.setLineDash([5, 4]); ctx.strokeStyle = "rgba(16,35,59,.33)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(mg.e, py(media)); ctx.lineTo(L - mg.d, py(media)); ctx.stroke();
    ctx.restore();

    // a linha
    ctx.beginPath();
    pontos.forEach(function (p, i) {
      if (i) { ctx.lineTo(px(i), py(p[1])); } else { ctx.moveTo(px(i), py(p[1])); }
    });
    ctx.strokeStyle = "#10233B"; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.stroke();

    ctx.textAlign = "center";
    // Rotulos fixos de um em um so quando cabem. No celular 17 anos nao cabem
    // (os anos ficavam um em cima do outro): sai de k em k contando do fim, para
    // o "Atual" ficar sempre; o resto aparece na mira (passar o mouse/dedo).
    var passo = pontos.length > 1 ? (L - mg.e - mg.d) / (pontos.length - 1) : L;
    var largura = 0;
    ctx.font = "600 11px Poppins, Arial";
    pontos.forEach(function (p) {
      largura = Math.max(largura, ctx.measureText(valorHist(p[1], chave)).width);
    });
    ctx.font = "11px Poppins, Arial";
    pontos.forEach(function (p) { largura = Math.max(largura, ctx.measureText(p[0]).width); });
    var k = Math.max(1, Math.ceil((largura + 6) / passo));
    pontos.forEach(function (p, i) {
      var x = px(i), y = py(p[1]);
      ctx.beginPath(); ctx.arc(x, y, k > 1 ? 3 : 4, 0, 7);
      ctx.fillStyle = "#fff"; ctx.fill();
      ctx.strokeStyle = "#10233B"; ctx.lineWidth = 2; ctx.stroke();
      if ((pontos.length - 1 - i) % k) return;
      // rotulo acima, mas abaixo quando o ponto esta colado no topo
      var acima = y - mg.t > 20;
      ctx.font = "600 11px Poppins, Arial"; ctx.fillStyle = "#10233B";
      ctx.fillText(valorHist(p[1], chave), x, acima ? y - 11 : y + 20);
      ctx.font = "11px Poppins, Arial"; ctx.fillStyle = "rgba(16,35,59,.5)";
      ctx.fillText(p[0], x, A - 9);
    });
    // a mesma mira da cotacao (rotulo flutuante e arrastar para a variacao)
    canvas._hit = null;
    canvas._linha = pontos.length < 2 ? null : {
      serie: pontos, L: L, A: A, e: mg.e, d: mg.d, t: mg.t, b: mg.b, py: py, cor: "#10233B", dpr: dpr,
      casas: 2, fmt: function (v) { return valorHist(v, chave); }, pp: !!EM_PCT[chave],
      data: function (a) { return a === "Atual" ? "atual (12 meses)" : a; },
      foto: ctx.getImageData(0, 0, canvas.width, canvas.height) };
  }

  function abrirHist(ticker, chave) {
    var pontos = (SERIES[ticker] || {})[chave];
    if (!pontos || pontos.length < 2) return;
    var vals = pontos.map(function (p) { return p[1]; });
    var media = vals.reduce(function (a, b) { return a + b; }, 0) / vals.length;
    var atual = pontos[pontos.length - 1];
    var menor = pontos.reduce(function (a, b) { return b[1] < a[1] ? b : a; });
    var maior = pontos.reduce(function (a, b) { return b[1] > a[1] ? b : a; });
    // contra a media: em pp quando o indicador ja e percentual, senao em %
    var dif = EM_PCT[chave]
      ? brl(Math.abs(atual[1] - media), 2) + "pp"
      : (media ? brl(Math.abs(atual[1] / media - 1) * 100, 2) + "%" : "—");
    var sinal = atual[1] >= media ? "acima" : "abaixo";

    $("modal-tit").textContent = chave + " — histórico";
    $("modal-sumario").innerHTML =
      "<div><dt>Média</dt><dd>" + valorHist(media, chave) + "</dd></div>" +
      "<div><dt>" + esc(atual[0]) + "</dt><dd>" + valorHist(atual[1], chave) + "</dd>" +
        '<div class="obs ' + (atual[1] >= media ? "pos" : "neg") + '">' +
        dif + " " + sinal + " da média</div></div>" +
      "<div><dt>Menor</dt><dd>" + valorHist(menor[1], chave) + "</dd>" +
        '<div class="obs">' + esc(menor[0]) + "</div></div>" +
      "<div><dt>Maior</dt><dd>" + valorHist(maior[1], chave) + "</dd>" +
        '<div class="obs">' + esc(maior[0]) + "</div></div>";
    $("modal-nota").textContent =
      "Cada ano usa o balanço daquele exercício — já reapresentado, quando a empresa " +
      "republicou — e o fechamento do último pregão do ano.";
    $("modal").hidden = false;
    desenharSerie($("modal-chart"), pontos, chave);
    $("modal-fechar").focus();
  }

  function fecharHist() { tirarMira(); esconderDica(); ANCORA = null; $("modal").hidden = true; }

  var NOTA = {
    "Bazin": "Dividendo médio de 5 anos dividido por 6% ao ano.",
    "Graham": "Raiz de 22,5 × LPA × VPA.",
    "Lynch": "LPA vezes o crescimento do lucro nos últimos 60 meses (até 25%).",
    "DCF": "Fluxo de caixa livre, 5 anos a 12% e perpetuidade de 4%.",
    "P/L histórico": "LPA vezes o P/L mediano da própria empresa nos últimos 10 anos.",
    "P/VP histórico": "VPA vezes o P/VP mediano da própria empresa nos últimos 10 anos.",
    "Média": "Média dos métodos que se aplicam a esta empresa."
  };
  // a nota do P/L historico diz QUAL mediana e de quantos anos
  function nota(nome, r) {
    var h = nome === "P/L histórico" ? r.pl_historico : nome === "P/VP histórico" ? r.pvp_historico : null;
    if (h)
      return (nome === "P/L histórico" ? "LPA × P/L" : "VPA × P/VP") + " mediano de " +
             brl(h.mediana, nome === "P/L histórico" ? 1 : 2) + " (" + h.anos + " anos entre " +
             h.de + " e " + h.ate + ").";
    return NOTA[nome];
  }

  // ---------- lista: a pagina principal, com filtros (filtros.js) ----------
  // Pedido do Ricardo (25/11/2026): sem ?t= a pagina abre na lista; com ?t=,
  // so a ficha. Os filtros vao no endereco (?dy_min=4&p_l_max=7).
  var FILTROS = null;
  var COLUNAS = [
    ["ticker", "Ticker"], ["nome", "Empresa"], ["subsetor", "Subsetor"], ["preco", "Preço"],
    ["p_l", "P/L"], ["p_vp", "P/VP"], ["ev_ebit", "EV/EBIT"], ["dy", "DY"], ["roe", "ROE"],
    ["roic", "ROIC"], ["margem_liq", "Marg. líq."], ["div_pl", "Dív. líq./PL"],
    ["volume", "Volume"], ["margem", "Teto médio"]
  ];
  // os nomes dos metodos como a funcao precos() devolve, e a chave no `ord`
  var METODOS = [["Bazin", "m_bazin"], ["Graham", "m_graham"], ["Lynch", "m_lynch"], ["DCF", "m_dcf"],
                 ["P/L histórico", "m_plh"], ["P/VP histórico", "m_pvph"], ["Média", "margem"]];
  function grupoFiltros() {
    return [
      { nome: "Valuation", campos: [
        { k: "p_l", nome: "P/L", unid: "×" }, { k: "p_vp", nome: "P/VP", unid: "×" },
        { k: "psr", nome: "PSR", unid: "×" }, { k: "ev_ebit", nome: "EV/EBIT", unid: "×" },
        { k: "ev_ebitda", nome: "EV/EBITDA", unid: "×" }, { k: "dy", nome: "Dividend yield", unid: "%" },
        { k: "payout", nome: "Payout", unid: "%" }] },
      { nome: "Rentabilidade", campos: [
        { k: "roe", nome: "ROE", unid: "%" }, { k: "roic", nome: "ROIC", unid: "%" },
        { k: "margem_liq", nome: "Margem líquida", unid: "%" }, { k: "margem_ebit", nome: "Margem EBIT", unid: "%" },
        { k: "cagr", nome: "Cresc. lucro 5a", unid: "%" }] },
      { nome: "Endividamento", nota: "Banco não tem dívida nem EV no sentido de empresa: com esses filtros, sai da lista.",
        campos: [
        { k: "div_pl", nome: "Dív. líquida/PL", unid: "×" }, { k: "div_ebitda", nome: "Dív. líquida/EBITDA", unid: "×" },
        { k: "liq_corr", nome: "Liquidez corrente", unid: "×" }] },
      { nome: "Tamanho e liquidez", campos: [
        { k: "valor_mercado", nome: "Valor de mercado", unid: "bi", mult: 1e9 },
        { k: "volume", nome: "Volume no pregão", unid: "mi", mult: 1e6 }] },
      { nome: "Preço por método · prévia para assinantes",
        nota: "Distância da cotação até o preço de cada método, em %. Mínimo 0 = cotação abaixo do preço do método; " +
              "20 = pelo menos 20% abaixo. Premissas da aba “Preço por método”.",
        campos: METODOS.map(function (x) { return { k: x[1], nome: x[0], unid: "%" }; }) }
    ];
  }
  function criarFiltros() {
    var setores = {};
    LISTA.forEach(function (x) { if (x.setor) (setores[x.setor] = setores[x.setor] || {})[x.subsetor || ""] = 1; });
    FILTROS = Filtros({
      el: $("filtros"),
      grupos: grupoFiltros(),
      selecoes: [
        { k: "setor", nome: "Setor", opcoes: function () { return Object.keys(setores).sort(); } },
        { k: "subsetor", nome: "Subsetor", opcoes: function (e) {
          var s = {};
          Object.keys(setores).forEach(function (k) {
            if (!e.setor || e.setor === k) Object.keys(setores[k]).forEach(function (x) { if (x) s[x] = 1; });
          });
          return Object.keys(s).sort();
        } }
      ],
      aoMudar: function () {
        render();
        try { history.replaceState({}, "", urlLista()); } catch (e) { /* file:// */ }
      }
    });
  }
  function urlLista() {
    var q = FILTROS ? FILTROS.consulta() : "";
    return location.pathname + (q ? "?" + q : "");
  }
  function mostrarLista(empurrar) {
    ATUAL = null;
    if (window.AoVivo && window.AoVivo.parar) window.AoVivo.parar();
    $("conteudo").hidden = true; $("vista-lista").hidden = false; $("voltar").hidden = true;
    document.title = "Ações — Muita Ação";
    if (empurrar) { try { history.pushState({}, "", urlLista()); } catch (e) { /* file:// */ } }
    render();
  }
  function cabecalho() {
    $("cabeca").innerHTML = COLUNAS.map(function (c) {
      return '<th data-col="' + c[0] + '"' + (ordem.col === c[0] ? ' aria-sort="' + (ordem.asc ? "ascending" : "descending") + '"' : "") +
        ">" + c[1] + (ordem.col === c[0] ? (ordem.asc ? " ↑" : " ↓") : "") + "</th>";
    }).join("");
  }
  function render() {
    if (!FILTROS) return;
    var termo = $("busca").value.trim().toLowerCase();
    var itens = LISTA.filter(function (x) {
      if (!FILTROS.passa(x.ord)) return false;
      if (!termo) return true;
      return (x.ticker + " " + x.nome + " " + (x.setor || "") + " " + (x.subsetor || ""))
        .toLowerCase().indexOf(termo) >= 0;
    });
    itens.sort(function (a, b) {
      var va = a.ord[ordem.col], vb = b.ord[ordem.col];
      if (va === null || va === undefined) return 1;
      if (vb === null || vb === undefined) return -1;
      if (typeof va === "string") return ordem.asc ? va.localeCompare(vb) : vb.localeCompare(va);
      return ordem.asc ? va - vb : vb - va;
    });
    cabecalho();
    var n = FILTROS.ativos() + (termo ? 1 : 0);
    $("lista-conta").textContent = n
      ? itens.length + " de " + LISTA.length + " ações passam no filtro"
      : LISTA.length + " ações · clique no título de uma coluna para ordenar";
    $("corpo").innerHTML = itens.length ? itens.map(function (x) {
      var marg = x.ord.margem, o = x.ord;
      return '<tr data-t="' + x.ticker + '"><td><a class="lk" href="?t=' + encodeURIComponent(x.ticker) + '">' +
        esc(x.ticker) + "</a></td><td>" + esc(x.nome) + '</td><td title="' + esc(x.setor || "") + '">' +
        esc(x.subsetor || "—") + "</td>" +
        "<td>" + num(x.mercado.preco) + "</td><td>" + num(o.p_l) + "</td>" +
        "<td>" + num(o.p_vp) + "</td><td>" + num(o.ev_ebit) + "</td><td>" + num(o.dy, 1, "%") + "</td>" +
        "<td>" + num(o.roe, 1, "%") + "</td><td>" + num(o.roic, 1, "%") + "</td>" +
        "<td>" + num(o.margem_liq, 1, "%") + "</td><td>" + num(o.div_pl) + "</td>" +
        "<td>" + (o.volume ? brl(o.volume / 1e6, 1) + " mi" : '<span class="na">—</span>') + "</td>" +
        '<td class="' + (marg === null ? "" : marg >= 0 ? "pos" : "neg") + '">' +
          (marg === null ? '<span class="na">—</span>' : (marg >= 0 ? "+" : "") + brl(marg, 0) + "%") +
        "</td></tr>";
    }).join("") : '<tr><td colspan="14" class="carregando">Nenhuma ação passa nesses filtros.</td></tr>';
  }

  // ---------- carga ----------
  Promise.all([
    fetch("dados-cvm.json").then(function (r) { return r.json(); }),
    fetch("historico.json").then(function (r) { return r.json(); }).catch(function () { return {}; }),
    fetch("series-indicadores.json").then(function (r) { return r.json(); }).catch(function () { return {}; })
  ]).then(function (res) {
    BASE = res[0]; HIST = res[1] || {}; SERIES = res[2] || {};
    Object.keys(BASE.empresas).forEach(function (cnpj) {
      var e = BASE.empresas[cnpj], r = e.resumo || {};
      Object.keys(e.mercado || {}).forEach(function (t) {
        var m = e.mercado[t], p = precos(r, m);
        var ord = {
          ticker: t, nome: e.nome, setor: e.setor_b3 || e.setor, subsetor: e.subsetor,
          preco: m.preco, p_l: m.p_l, p_vp: m.p_vp, psr: m.psr,
          ev_ebit: m.ev_ebit_contabil, ev_ebitda: m.ev_ebitda, dy: m.dy, payout: m.payout,
          roe: r.roe, roic: r.roic, margem_liq: r.margem_liquida, margem_ebit: r.margem_ebit_contabil,
          // divida e liquidez nao dizem nada num banco (a captacao e a materia-prima):
          // somem da coluna e do filtro, como na regra do pipeline
          cagr: r.cagr_60m, div_pl: r.financeira ? null : r.div_liq_patrimonio,
          div_ebitda: (!r.financeira && r.divida_liquida_atual !== undefined && r.divida_liquida_atual !== null && r.ebitda_ttm > 0)
            ? r.divida_liquida_atual / r.ebitda_ttm : null,
          liq_corr: r.financeira ? null : r.liquidez_corrente, volume: m.volume,
          // por acao ON-equivalente x contagem: numa unit o preco e de n acoes
          valor_mercado: (m.preco && r.acoes_atual) ? m.preco / (m.acoes_por_unit || 1) * r.acoes_atual : null
        };
        // distancia da cotacao ate cada metodo (a "Media" e a coluna Teto medio)
        METODOS.forEach(function (x) {
          var v = p[x[0]];
          ord[x[1]] = (v && isFinite(v) && v > 0 && m.preco) ? (v / m.preco - 1) * 100 : null;
        });
        LISTA.push({
          ticker: t, cnpj: cnpj, nome: e.nome,
          setor: e.setor_b3 || e.setor, subsetor: e.subsetor,
          resumo: r, mercado: m, ord: ord
        });
      });
    });
    LISTA.sort(function (a, b) { return (b.mercado.volume || 0) - (a.mercado.volume || 0); });
    $("tickers").innerHTML = LISTA.map(function (x) {
      return '<option value="' + x.ticker + '">' + esc(x.nome) + "</option>";
    }).join("");
    $("rodape").innerHTML =
      "<b>" + LISTA.length + " papéis</b> de " + BASE.total_empresas + " empresas. " +
      "Fundamentos dos Dados Abertos da CVM e do RAD; cotação e histórico do pregão da B3; " +
      "classificação setorial da B3. Pregão de <b>" + dataBR(BASE.pregao) + "</b>. " +
      "Os preços por método usam premissas fixas e clássicas de cada autor — para mexer nelas, " +
      'use a <a href="calculadora-preco-teto.html">calculadora</a>. ' +
      "<br><br><b>Duas convenções de EBIT.</b> O <b>contábil</b> é a conta 3.05 da CVM, que inclui " +
      "impairment, outras despesas operacionais e equivalência patrimonial; o <b>recorrente</b> é o " +
      "resultado bruto menos despesas com vendas e administrativas. Reproduzimos os dois ao " +
      "centésimo, e cada site do mercado escolheu um: Status Invest e Investidor10 usam o contábil, " +
      "o Fundamentus usa o recorrente. Aqui o <b>contábil</b> é o padrão — além de ser a convenção " +
      "de dois dos três, é o que produz menos número inútil (26 EV/EBIT negativos contra 31, e 3 " +
      "acima de 100× contra 7). O recorrente aparece ao lado, porque ele é mais estável de um ano " +
      "para o outro e a distância entre os dois é o próprio aviso de que houve item não recorrente " +
      "grande: na Vale a margem EBIT é 30,4% recorrente contra 11,7% contábil, tudo provisão de " +
      "Samarco. O <b>ROIC</b> é a exceção e segue no recorrente, porque ali o contábil não melhorou " +
      "nada contra as referências.<br><br>" +
      "<b>Histórico por indicador.</b> O botão ao lado de cada número abre o valor ano a ano. Cada " +
      "ano usa o balanço daquele exercício — já reapresentado quando a empresa republicou — e o " +
      "fechamento do último pregão do ano.<br><br>" +
      "Conteúdo educacional, não é recomendação de investimento.";
    criarFiltros();
    var pedido = tickerDaUrl();
    if (LISTA.some(function (x) { return x.ticker === pedido; })) abrir(pedido);
    else { PRIMEIRA = false; mostrarLista(false); }
  }).catch(function (e) {
    $("conteudo").innerHTML = '<div class="carregando">Não consegui carregar a base.</div>';
  });

  $("modal-fechar").addEventListener("click", fecharHist);
  $("modal").addEventListener("click", function (ev) {
    if (ev.target === $("modal")) fecharHist();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && !$("modal").hidden) fecharHist();
  });
  // delegado: os paineis sao reescritos a cada troca de empresa
  $("conteudo").addEventListener("click", function (ev) {
    var b = ev.target.closest(".hist");
    if (b && ATUAL) abrirHist(ATUAL.ticker, b.dataset.ind);
  });

  $("busca").addEventListener("input", function () {
    var t = $("busca").value.trim().toUpperCase();
    if (LISTA.some(function (x) { return x.ticker === t; })) { abrir(t); return; }
    // texto que nao e ticker: procura na lista
    if (t && $("vista-lista").hidden) mostrarLista(true);
    else render();
  });
  $("voltar").addEventListener("click", function (ev) {
    if (!cliqueSimples(ev)) return;
    ev.preventDefault();
    mostrarLista(true);
    window.scrollTo({ top: 0 });
  });
  $("corpo").addEventListener("click", function (ev) {
    var tr = ev.target.closest("tr");
    if (!tr || !tr.dataset.t || !cliqueSimples(ev)) return;
    ev.preventDefault();
    abrir(tr.dataset.t); window.scrollTo({ top: 0, behavior: "smooth" });
  });
  window.addEventListener("popstate", function () {
    if (!LISTA.length) return;
    var t = tickerDaUrl();
    if (LISTA.some(function (x) { return x.ticker === t; })) { VOLTANDO = true; abrir(t); VOLTANDO = false; return; }
    if (FILTROS) FILTROS.lerUrl();
    mostrarLista(false);
  });
  $("cabeca").addEventListener("click", function (ev) {
    var th = ev.target.closest("th[data-col]");
    if (!th) return;
    var c = th.dataset.col, texto = c === "ticker" || c === "nome" || c === "subsetor";
    ordem = (ordem.col === c) ? { col: c, asc: !ordem.asc } : { col: c, asc: texto };
    render();
  });
  window.addEventListener("resize", function () {
    grafPreco();
    if ($("aba-gra") && !$("aba-gra").hidden) redesenharGraficos();
    var tit = $("modal-tit").textContent.split(" — ")[0];
    if (ATUAL && !$("modal").hidden && (SERIES[ATUAL.ticker] || {})[tit])
      desenharSerie($("modal-chart"), SERIES[ATUAL.ticker][tit], tit);
  });
})();
</script>
</body>
</html>
